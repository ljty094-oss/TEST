      /* ==============================================================
       * 3. 층 이동 규칙
       * ============================================================== */
      const isGamblePoint = f => f > 0 && f < MAX_FLOOR && f % 10 === 0;
      const stageOf = f => Math.floor(Math.min(MAX_FLOOR, Math.max(0, f)) / 10);
      const capTop = f => Math.min(MAX_FLOOR, f);
      const floorText = f => (f === 0 ? "로비" : `${f}층`);
      const pct = x => (x * 100).toFixed(0);

      function sideDensity(f, x) {
        let c = 0;
        for (let k = SIDE_MIN; k <= SIDE_MAX; k++) if (capTop(f + k) === x) c++;
        return c / (SIDE_MAX - SIDE_MIN + 1);
      }
      function grandDensity(f, x) {
        let c = 0;
        for (let k = GRAND_MIN; k <= GRAND_MAX; k++) if (capTop(f + k) === x) c++;
        return c / (GRAND_MAX - GRAND_MIN + 1);
      }
      function ascentDensity(f, x) {
        const d = f - x;
        return d >= ASCENT_MIN && d <= ASCENT_MAX ? 1 / (ASCENT_MAX - ASCENT_MIN + 1) : 0;
      }
      // 한 번의 강하로 실제 가능한 이동인지 (새 입장·화면 전환·오인식은 기록하지 않음)
      function isPossibleMove(before, after) {
        if (!Number.isInteger(before) || !Number.isInteger(after)) return false;
        if (before < 0 || before >= MAX_FLOOR || after < 0 || after > MAX_FLOOR) return false;
        if (sideDensity(before, after) > 0) return true;
        return isGamblePoint(before) && (grandDensity(before, after) > 0 || ascentDensity(before, after) > 0);
      }

      /* ==============================================================
       * 4. 기록 저장 (내 기기 + Supabase)
       * ============================================================== */
      function loadRecords() {
        try {
          const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return [];
        }
      }

      function saveRecords() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.records.slice(-3000)));
        } catch (e) {
          console.warn("localStorage 저장 실패:", e);
        }
      }

      function isSupabaseConfigured() {
        return Boolean(EXTERNAL_DB_CONFIG.supabaseUrl && EXTERNAL_DB_CONFIG.supabaseAnonKey && EXTERNAL_DB_CONFIG.supabaseTable);
      }

      function dbEndpoint() {
        const baseUrl = EXTERNAL_DB_CONFIG.supabaseUrl.replace(/\/+$/, "");
        return `${baseUrl}/rest/v1/${encodeURIComponent(EXTERNAL_DB_CONFIG.supabaseTable)}`;
      }

      function dbHeaders(extra) {
        // publishable 키(sb_publishable_...)는 JWT가 아니므로 apikey 헤더에만 넣습니다.
        const headers = Object.assign({ apikey: EXTERNAL_DB_CONFIG.supabaseAnonKey }, extra || {});
        if (!EXTERNAL_DB_CONFIG.supabaseAnonKey.startsWith("sb_")) {
          headers.Authorization = `Bearer ${EXTERNAL_DB_CONFIG.supabaseAnonKey}`;
        }
        return headers;
      }

      /* 기존 테이블 컬럼을 그대로 사용합니다.
       * floor = 도착 층, delta = 도착 층 - 출발 층(상승이면 음수),
       * direction = 출발 층에서 사이트가 추천했던 방향, remaining_turns = 출발 시 남은 강하 횟수,
       * gamble = 출발 층이 가운데가 나오는 10층 단위 층이었는지 */
      function toDbRow(r) {
        return {
          user_id: r.userId,
          recorded_at: new Date(r.ts).toISOString(),
          floor: r.floorAfter,
          delta: r.floorAfter - r.floorBefore,
          direction: r.direction,
          remaining_turns: r.remainingTurns,
          gamble: r.gamble
        };
      }

      function fromDbRow(row) {
        const floorAfter = Number(row.floor);
        const delta = Number(row.delta);
        return {
          userId: row.user_id,
          ts: Date.parse(row.recorded_at),
          floorBefore: floorAfter - delta,
          floorAfter,
          direction: row.direction,
          remainingTurns: row.remaining_turns,
          gamble: Boolean(row.gamble),
          synced: true
        };
      }

      async function pushRecordToExternalDb(record) {
        const key = `${record.userId}|${record.ts}`;
        if (state.inFlight.has(key)) return false;
        state.inFlight.add(key);
        let ok = false;
        if (isSupabaseConfigured()) {
          try {
            const res = await fetch(dbEndpoint(), {
              method: "POST",
              headers: dbHeaders({ "Content-Type": "application/json", Prefer: "return=minimal" }),
              body: JSON.stringify(toDbRow(record))
            });
            ok = res.ok;
            state.dbStatus = res.ok ? "저장 완료" : `저장 실패 (${res.status})`;
            if (!res.ok) console.warn("Supabase 저장 응답 오류:", res.status, await res.text().catch(() => ""));
          } catch (err) {
            state.dbStatus = "저장 실패 (네트워크)";
            console.warn("Supabase 네트워크 전송 실패:", err);
          }
        }
        if (EXTERNAL_DB_CONFIG.customPostUrl) {
          try {
            await fetch(EXTERNAL_DB_CONFIG.customPostUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(toDbRow(record))
            });
          } catch (err) {
            console.warn("외부 엔드포인트 전송 실패:", err);
          }
        }
        state.inFlight.delete(key);
        if (ok) {
          record.synced = true;
          saveRecords();
          if (state.remote && !state.remoteKeys.has(key)) {
            state.remoteKeys.add(key); // 다음에 서버에서 같은 기록을 받아도 다시 더하지 않음
            state.remote.push(Object.assign({}, record));
          }
        }
        render();
        return ok;
      }

      // 저장에 실패했던 내 기록 재전송
      async function retryUnsynced() {
        if (!isSupabaseConfigured()) return;
        const pending = state.records.filter(r => r.userId === state.userId && !r.synced).slice(0, 20);
        for (const r of pending) {
          const ok = await pushRecordToExternalDb(r);
          if (!ok) break;
        }
      }

      // 첫 접속: 전체 기록(최신순, 최대 1만 건) / 이후 1분마다: 이미 받은 기록보다 번호가 큰 새 기록만
      async function fetchRemoteRecords() {
        if (!isSupabaseConfigured()) return;
        const incremental = Boolean(state.remote) && state.remoteMaxId > 0;
        const rows = [];
        try {
          for (let page = 0; page < REMOTE_MAX_PAGES; page++) {
            const params = {
              select: "id,user_id,recorded_at,floor,delta,direction,remaining_turns,gamble",
              recorded_at: `gte.${DATA_SINCE}`,
              order: incremental ? "id.asc" : "recorded_at.desc",
              limit: String(REMOTE_PAGE_SIZE),
              offset: String(page * REMOTE_PAGE_SIZE)
            };
            if (incremental) params.id = `gt.${Math.max(0, state.remoteMaxId - REMOTE_ID_OVERLAP)}`;
            const q = new URLSearchParams(params);
            const res = await fetch(`${dbEndpoint()}?${q.toString()}`, { headers: dbHeaders() });
            if (!res.ok) {
              // 이미 받아 둔 기록이 있으면 그대로 쓰고 다음 주기에 새 기록만 다시 시도
              state.dbStatus = state.remote
                ? `새 기록 읽기 실패 (${res.status}) — 받아 둔 기록 ${state.remote.length}건으로 계속`
                : `읽기 실패 (${res.status}) — 내 기기 기록만 사용`;
              refreshRecommendation(false);
              return;
            }
            const chunk = await res.json();
            rows.push(...chunk);
            if (chunk.length < REMOTE_PAGE_SIZE) break;
          }
          mergeRemoteRows(rows, !incremental);
          state.dbStatus = `연결됨 · 수집 기록 ${state.remote.length}건 반영` +
            (incremental ? ` (새로 받은 기록 ${rows.length}건 확인)` : " (전체 받음)");
        } catch (err) {
          state.dbStatus = state.remote
            ? `새 기록 읽기 실패 (네트워크) — 받아 둔 기록 ${state.remote.length}건으로 계속`
            : "읽기 실패 (네트워크) — 내 기기 기록만 사용";
        }
        refreshRecommendation(false);
        retryUnsynced();
      }

      // 서버에서 받은 기록 합치기: 같은 기록(사용자|시각)은 1건만, 통계에 못 쓰는 기록·중복 이동은 제외
      function mergeRemoteRows(rows, full) {
        if (full || !state.remote) {
          state.remote = [];
          state.remoteKeys = new Set();
          state.remoteMaxId = 0;
        }
        rows.forEach(row => {
          const id = Number(row.id);
          if (Number.isFinite(id) && id > state.remoteMaxId) state.remoteMaxId = id;
          const r = fromDbRow(row);
          if (!["left", "center", "right"].includes(r.direction) || !isPossibleMove(r.floorBefore, r.floorAfter)) return;
          const key = `${r.userId}|${r.ts}`;
          if (state.remoteKeys.has(key)) return;
          state.remoteKeys.add(key);
          state.remote.push(r);
        });
        state.remote = dropDuplicateMoves(state.remote);
        const cap = REMOTE_PAGE_SIZE * REMOTE_MAX_PAGES;
        if (state.remote.length > cap) state.remote = state.remote.slice(-cap); // 최신 1만 건만 사용 (위에서 시간순 정렬됨)
      }

      // 층 오인식 등으로 같은 사람의 같은 이동(출발층→도착층)이 DUPLICATE_MOVE_MS 안에 또 기록된 경우 첫 기록만 남김.
      // 정상적인 연속 강하는 출발층이 매번 바뀌므로 빠르게 내려가도 지워지지 않음
      function isDuplicateMove(prev, r) {
        return Boolean(prev) && prev.floorBefore === r.floorBefore && prev.floorAfter === r.floorAfter &&
          r.ts - prev.ts >= 0 && r.ts - prev.ts <= DUPLICATE_MOVE_MS;
      }
      function dropDuplicateMoves(list) {
        const lastByUser = new Map();
        return list.slice().sort((a, b) => a.ts - b.ts).filter(r => {
          if (isDuplicateMove(lastByUser.get(r.userId), r)) return false;
          lastByUser.set(r.userId, r);
          return true;
        });
      }

      // 서버 기록 + 아직 서버에 없는 내 기기 기록
      function allRecords() {
        const local = state.records.filter(r => isPossibleMove(r.floorBefore, r.floorAfter));
        if (!state.remote) return local;
        return state.remote.concat(local.filter(r => !state.remoteKeys.has(`${r.userId}|${r.ts}`)));
      }

      function appendMoveRecord(move) {
        const now = Date.now();
        let prev = null;
        for (let i = state.records.length - 1; i >= 0; i--) {
          if (state.records[i].userId === state.userId) { prev = state.records[i]; break; }
        }
        if (isDuplicateMove(prev, { floorBefore: move.floorBefore, floorAfter: move.floorAfter, ts: now })) return; // 같은 이동 중복 기록 방지
        const record = Object.assign({ userId: state.userId, ts: now, synced: false }, move);
        state.records.push(record);
        if (state.records.length > 3000) state.records.shift();
        saveRecords();
        pushRecordToExternalDb(record);
      }

      /* ==============================================================
       * 5. 수집 데이터 분석
       * ============================================================== */

      /* 가운데의 '대강하' 비율 추정.
       * 화면만으로는 사용자가 실제로 어느 방향으로 갔는지 알 수 없으므로,
       * 10층 단위 층에서 출발한 이동을 '좌/우(1~20층 균등) + 가운데(대강하 15~20 / 상승 1~5)'의 혼합으로 보고
       * 대강하 비율 p를 베이즈 격자 계산으로 추정합니다. (상승은 가운데에서만 나오므로 p를 구분할 수 있습니다.)
       * 사이트가 가운데를 추천했던 출발과 좌/우를 추천했던 출발은 실제로 가운데를 고른 비율이 다르므로 따로 계산하고,
       * '아무도 가운데를 안 고른 경우'도 함께 고려해, 가운데 데이터가 없을 때는 p를 모르는 상태(기본값)로 둡니다. */
      function estimateGrandRate(records) {
        const G = 60;
        const groups = { center: new Map(), side: new Map() };
        let n = 0;
        let ascents = 0;
        records.forEach(r => {
          if (!isGamblePoint(r.floorBefore) || !isPossibleMove(r.floorBefore, r.floorAfter)) return;
          const g = r.direction === "center" ? groups.center : groups.side;
          const key = r.floorBefore * 1000 + r.floorAfter;
          g.set(key, (g.get(key) || 0) + 1);
          n++;
          if (r.floorAfter < r.floorBefore) ascents++;
        });

        const logPost = new Float64Array(G); // p에 대한 균등 사전분포
        [groups.center, groups.side].forEach(g => {
          if (g.size === 0) return;
          const obs = [];
          g.forEach((cnt, key) => {
            const f = Math.floor(key / 1000);
            const x = key % 1000;
            obs.push({ cnt, s: sideDensity(f, x), g: grandDensity(f, x), a: ascentDensity(f, x) });
          });
          // 가운데를 고른 사람이 없는 경우(q = 0)의 가능도
          let ll0 = 0;
          for (const o of obs) ll0 += o.s > 0 ? o.cnt * Math.log(o.s) : -Infinity;
          const lls = new Float64Array(G);
          for (let j = 0; j < G; j++) {
            const p = (j + 0.5) / G;
            let maxI = -Infinity;
            for (let i = 0; i < G; i++) {
              const q = (i + 0.5) / G; // 이 그룹에서 실제로 가운데를 고른 비율
              let ll = 0;
              for (const o of obs) ll += o.cnt * Math.log((1 - q) * o.s + q * (p * o.g + (1 - p) * o.a));
              lls[i] = ll;
              if (ll > maxI) maxI = ll;
            }
            let sum = 0;
            for (let i = 0; i < G; i++) sum += Math.exp(lls[i] - maxI);
            const slab = maxI + Math.log(sum / G);
            const m = Math.max(ll0, slab);
            logPost[j] += m + Math.log(0.5 * Math.exp(ll0 - m) + 0.5 * Math.exp(slab - m));
          }
        });

        let maxL = -Infinity;
        for (let j = 0; j < G; j++) if (logPost[j] > maxL) maxL = logPost[j];
        const w = new Float64Array(G);
        let tot = 0;
        for (let j = 0; j < G; j++) {
          w[j] = Math.exp(logPost[j] - maxL);
          tot += w[j];
        }
        let m1 = 0, m2 = 0;
        for (let j = 0; j < G; j++) {
          const p = (j + 0.5) / G;
          w[j] /= tot;
          m1 += p * w[j];
          m2 += p * p * w[j];
        }
        return {
          mean: m1,
          sd: Math.sqrt(Math.max(0, m2 - m1 * m1)),
          n,
          ascents,
          // 추정 분포에서 p 하나를 뽑음 (불확실할수록 넓게 뽑힘)
          sample() {
            let u = Math.random();
            for (let j = 0; j < G; j++) {
              u -= w[j];
              if (u <= 0) return (j + Math.random()) / G;
            }
            return (G - 0.5) / G;
          }
        };
      }

      /* 왼쪽/오른쪽 비교: 10층 단위가 아닌 층(가운데 없음)에서, 추천된 쪽별 평균 강하 층수 */
      function analyzeSides(records) {
        const s = { left: { n: 0, sum: 0 }, right: { n: 0, sum: 0 } };
        records.forEach(r => {
          if (r.direction !== "left" && r.direction !== "right") return;
          if (isGamblePoint(r.floorBefore) || r.floorBefore > MAX_FLOOR - SIDE_MAX) return; // 100층 제한에 잘리는 구간 제외
          const d = r.floorAfter - r.floorBefore;
          if (d < SIDE_MIN || d > SIDE_MAX) return;
          s[r.direction].n++;
          s[r.direction].sum += d;
        });
        ["left", "right"].forEach(k => {
          const a = s[k];
          a.raw = a.n ? a.sum / a.n : null;
          a.mean = (SIDE_PRIOR_N * SIDE_PRIOR_MEAN + a.sum) / (SIDE_PRIOR_N + a.n);
          a.sd = SIDE_SD / Math.sqrt(SIDE_PRIOR_N + a.n);
        });
        const z = (s.left.mean - s.right.mean) / Math.sqrt(s.left.sd ** 2 + s.right.sd ** 2);
        s.better = Math.abs(z) >= SIDE_DIFF_Z ? (z > 0 ? "left" : "right") : null;
        return s;
      }

      // 수집 데이터에서 한쪽이 확실히 유리하면 그쪽, 아니면 두 방향의 기대값이 같으므로 아무 쪽
      function pickSide(s) {
        if (s.better) return s.better;
        return Math.random() < 0.5 ? "left" : "right";
      }

      /* 남은 강하 횟수 동안의 최종 보상 기대값(단계별 가치)을 최대화하는 계산 */
      function makeSolver(pGrand) {
        const memo = new Map();
        const value = f => STAGE_VALUE[stageOf(f)];
        function V(f, r) {
          if (f >= MAX_FLOOR || r <= 0) return value(f);
          const key = f * 64 + r;
          const hit = memo.get(key);
          if (hit !== undefined) return hit;
          const q = Q(f, r);
          const v = q.center === null ? q.side : Math.max(q.side, q.center);
          memo.set(key, v);
          return v;
        }
        function Q(f, r) {
          let side = 0;
          for (let k = SIDE_MIN; k <= SIDE_MAX; k++) side += V(capTop(f + k), r - 1);
          side /= SIDE_MAX - SIDE_MIN + 1;
          let center = null;
          if (isGamblePoint(f)) {
            let g = 0, a = 0;
            for (let k = GRAND_MIN; k <= GRAND_MAX; k++) g += V(capTop(f + k), r - 1);
            for (let k = ASCENT_MIN; k <= ASCENT_MAX; k++) a += V(f - k, r - 1);
            center = pGrand * g / (GRAND_MAX - GRAND_MIN + 1) + (1 - pGrand) * a / (ASCENT_MAX - ASCENT_MIN + 1);
          }
          return { side, center };
        }
        return { V, Q };
      }

      /* 나락: 계속 강하 vs '중단하고 보상 받기' 계산
       * 강하하면 1~20층 무작위('최소 16층' 효과면 16~20층), 도착 층이 사망 층이면 부활 1회 소모 후 그 층에서 계속,
       * 부활이 없으면 보상 0. 100층은 항상 생존. 남은 강하 동안 기대 보상이 가장 큰 쪽을 고름 */
      const abyssMemo = [new Map(), new Map()];
      const stageValue = f => STAGE_VALUE[stageOf(f)];
      function abyssV(f, r, k, par) {
        if (f >= MAX_FLOOR || r <= 0) return stageValue(f);
        const key = (f * 16 + Math.min(r, 15)) * 4 + Math.min(k, 3);
        const memo = abyssMemo[par];
        const hit = memo.get(key);
        if (hit !== undefined) return hit;
        const v = Math.max(stageValue(f), abyssGo(f, r, k, par, SIDE_MIN, SIDE_MAX));
        memo.set(key, v);
        return v;
      }
      function abyssGo(f, r, k, par, dMin, dMax) {
        let sum = 0;
        for (let d = dMin; d <= dMax; d++) {
          const x = capTop(f + d);
          if (x >= MAX_FLOOR || x % 2 === par) sum += abyssV(x, r - 1, k, par);
          else if (k > 0) sum += abyssV(x, r - 1, k - 1, par);
        }
        return sum / (dMax - dMin + 1);
      }
      function abyssSurvival(f, par, dMin, dMax) {
        let safe = 0;
        for (let d = dMin; d <= dMax; d++) {
          const x = capTop(f + d);
          if (x >= MAX_FLOOR || x % 2 === par) safe++;
        }
        return safe / (dMax - dMin + 1);
      }
      // par: 1 = 홀수 생존, 0 = 짝수 생존, null = 모름(두 경우 평균)
      function abyssDecision(f, r, k, par, leap) {
        const dMin = leap ? LEAP_MIN : SIDE_MIN;
        const dMax = leap ? LEAP_MAX : SIDE_MAX;
        const kk = Math.min(Math.max(k, 0), 3);
        const pars = par === null ? [0, 1] : [par];
        let go = 0, surv = 0;
        pars.forEach(p => {
          go += abyssGo(f, r, kk, p, dMin, dMax) / pars.length;
          surv += abyssSurvival(f, p, dMin, dMax) / pars.length;
        });
        const stop = stageValue(f);
        return { go, stop, surv, continueBetter: go > stop };
      }

      /* ==============================================================
       * 6. 추천
       * ============================================================== */
      // 직전 강하 안내: 화면만으로는 실제로 들어간 입구를 알 수 없어 '출발할 때의 추천'을 표시
      // (상승은 가운데에서만 나오므로 '가운데 선택'으로 표시)
      function moveText() {
        const mv = state.lastMove;
        if (!mv || mv.to !== state.floor) return "";
        if (mv.to < mv.from) {
          return `가운데 선택 → ${floorText(mv.from)}에서 ${floorText(mv.to)}으로 ${mv.from - mv.to}층 올라갔습니다.`;
        }
        if (mv.direction === "stop" || !LABEL[mv.direction]) {
          // 나락에서 '중단' 추천과 달리 계속 내려간 경우
          return `${floorText(mv.from)}에서 ${floorText(mv.to)}으로 ${mv.to - mv.from}층 내려왔습니다.`;
        }
        return `직전 추천 '${LABEL[mv.direction]}' → ${floorText(mv.from)}에서 ${floorText(mv.to)}으로 ${mv.to - mv.from}층 내려왔습니다.`;
      }

      // 나락: 직전 강하 결과 (생존 / 사망 후 부활 / 사망으로 보상 소멸)
      function abyssOutcome() {
        const f = state.floor;
        const mv = state.lastMove;
        if (!f) return null;
        const death = state.abyssDeath && state.abyssDeath.floor === f ? state.abyssDeath : null;
        if (death) {
          return death.revived
            ? { kind: "revived", text: `${PARITY_NAME[f % 2]} 층에 도착해 사망… 부활 1회를 사용했습니다.` }
            : { kind: "failed", text: `${PARITY_NAME[f % 2]} 층에 도착해 사망… 부활이 없어 보상 기회가 사라졌습니다.` };
        }
        if (!mv || mv.to !== f) return null;
        if (f >= MAX_FLOOR) return { kind: "survive", text: "100층은 사망하지 않습니다. 생존!" };
        if (state.abyssSafe === null) return null;
        return { kind: "survive", text: `${PARITY_NAME[f % 2]} 층이라 생존!` };
      }

      function abyssRecommendation(rec, arrivedNewFloor) {
        const f = state.floor;
        const r = state.turns;
        const k = state.revives === null ? ABYSS_DEFAULT_REVIVES : state.revives;
        const leap = Boolean(state.altarEffect === ALTAR.leap && state.altarFloor === f);
        const dec = abyssDecision(f, r === null ? 3 : r, k, state.abyssSafe, leap);
        if (arrivedNewFloor || !state.sideChoice) {
          state.sideChoice = pickSide(analyzeSides(allRecords()));
          state.cheerIndex = Math.floor(Math.random() * 3);
        }
        rec.active = true;
        rec.direction = dec.continueBetter ? state.sideChoice : "stop";
        rec.headline = `지금은 '${LABEL[rec.direction]}' 추천`;

        const survPct = state.abyssSafe === null ? null : Math.round(dec.surv * 100);
        let reason;
        if (rec.direction === "stop") {
          reason = k > 0
            ? "지금 멈추는 쪽이 기대 보상이 더 큽니다."
            : `부활을 모두 써서 다음 강하에서 사망하면 보상이 사라집니다${survPct !== null ? ` (생존 확률 ${survPct}%)` : ""}. 지금 멈추는 쪽이 유리합니다.`;
        } else if (k > 0) {
          reason = `부활 ${k}회가 남아 있어 사망해도 보상이 사라지지 않습니다. 계속 내려가는 쪽이 유리합니다.`;
        } else {
          const why = leap ? "'최소 16층' 효과로 크게 내려갈 수 있어" : "100층(사망 없음)에 가까워";
          reason = `부활은 없지만 ${why} 계속 가는 쪽의 기대 보상이 더 큽니다${survPct !== null ? ` (생존 확률 ${survPct}%)` : ""}.`;
        }

        const out = abyssOutcome();
        rec.parts = [
          { text: moveText() },
          out ? { text: out.text, cls: out.kind === "survive" ? "survive-line" : "death-line" } : null,
          { text: reason }
        ].filter(Boolean);
        rec.tone = out && out.kind !== "survive" ? "death" : null;

        const mv = state.lastMove;
        const d = mv && mv.to === f ? mv.to - mv.from : 0;
        const stop = rec.direction === "stop";
        let list;
        if (f === 0) list = ABYSS_CHEERS.lobby;
        else if (out && out.kind === "revived") list = stop ? ABYSS_CHEERS.revivedStop : ABYSS_CHEERS.revivedGo;
        else if (out && out.kind === "survive") {
          list = stop ? ABYSS_CHEERS.surviveStop
            : (d <= 4 ? ABYSS_CHEERS.surviveTiny : (d >= 15 ? ABYSS_CHEERS.surviveGreat : ABYSS_CHEERS.surviveGo));
        } else list = stop ? ABYSS_CHEERS.stop : ABYSS_CHEERS.go;
        rec.cheer = fillAbyssCheer(list, { d, f, par: PARITY_NAME[f % 2], dirRo: DIR_RO[rec.direction] || "" });
      }

      function refreshRecommendation(arrivedNewFloor) {
        const f = state.floor;
        const r = state.turns;
        const rec = { active: false, direction: null, alt: null, dual: null, centerAvailable: false, floor: f, turns: r, headline: "", detail: "", parts: null, tone: null, cheer: "" };

        if (f === null) {
          rec.headline = state.stream ? "HUD에서 현재 층수를 읽는 중입니다" : "공유를 시작하면 자동으로 추천합니다";
          rec.detail = "";
          rec.cheer = "오늘도 대박 층수 노려봅시다!";
          state.rec = rec;
          render();
          return;
        }

        if (state.abyss && state.abyssFailed) {
          // 나락: 부활 없이 사망 → 보상 기회 소멸
          const out = abyssOutcome();
          rec.headline = "사망 · 이번 나락은 보상 없이 종료되었습니다";
          rec.parts = [
            { text: moveText() },
            out ? { text: out.text, cls: "death-line" } : null,
            { text: "다음 열쇠로 입장하면 자동으로 다시 추천합니다." }
          ].filter(Boolean);
          rec.tone = "death";
          rec.cheer = "부활 없이 사망해 보상이 사라졌어요… 정말 아쉬워요. 다음 열쇠로 꼭 만회해 봅시다!";
          state.rec = rec;
          render();
          return;
        }

        if (r === 0 && f < MAX_FLOOR && state.departureLocked && !state.ended) {
          // 마지막 강하를 시작해 아직 도착 전 (도착하면 최종 결과 표시)
          rec.headline = "마지막 강하 중입니다";
          rec.cheer = "끝까지 깊게 내려가 봅시다!";
          state.rec = rec;
          render();
          return;
        }

        if (state.ended || f >= MAX_FLOOR || r === 0) {
          if (state.abyss) {
            const out = abyssOutcome();
            rec.headline = f >= MAX_FLOOR ? "100층 도달! 이번 나락이 종료되었습니다"
              : (r === 0 ? "남은 강하 0회 · 이번 나락이 종료되었습니다" : `${floorText(f)} 보상 획득 · 이번 나락이 종료되었습니다`);
            rec.parts = [
              { text: moveText() },
              out ? { text: out.text, cls: out.kind === "survive" ? "survive-line" : "death-line" } : null,
              { text: `최종 ${floorText(f)} · 보상 ${stageOf(f)}단계. 다음 열쇠로 입장하면 자동으로 다시 추천합니다.` }
            ].filter(Boolean);
            rec.cheer = abyssFinishCheer(f);
            state.rec = rec;
            render();
            return;
          }
          rec.headline = f >= MAX_FLOOR ? "100층 도달! 이번 판이 종료되었습니다"
            : (r === 0 ? "남은 강하 0회 · 이번 판이 종료되었습니다" : "이번 판이 종료되었습니다");
          rec.detail = [moveText(), `최종 ${floorText(f)} · 보상 ${stageOf(f)}단계. 다음 열쇠로 입장하면 자동으로 다시 추천합니다.`].filter(Boolean).join(" ");
          rec.cheer = finishCheer(f);
          state.rec = rec;
          render();
          return;
        }

        if (state.abyss) {
          abyssRecommendation(rec, arrivedNewFloor);
          state.rec = rec;
          if (!state.departureLocked) state.departureRec = rec;
          render();
          return;
        }

        const turnsForCalc = r === null ? 3 : r;
        const data = allRecords();
        const sides = analyzeSides(data);
        if (arrivedNewFloor || !state.sideChoice) {
          state.sideChoice = pickSide(sides);
          state.cheerIndex = Math.floor(Math.random() * 3);
        }

        rec.active = true;
        rec.direction = state.sideChoice;
        rec.centerAvailable = isGamblePoint(f) && !state.abyss;

        if (rec.centerAvailable) {
          const grand = estimateGrandRate(data);
          if (f >= DUAL_MIN_FLOOR) {
            // 70·80·90층: 안정(왼쪽/오른쪽 중 1곳)과 도박(가운데)을 함께 제시.
            // 데이터 수집 중이어도 현재 추정 대강하 비율로 남은 강하 동안의 기대 보상을 계산해 유리한 쪽을 추천
            const q = makeSolver(grand.mean).Q(f, turnsForCalc);
            const centerBetter = q.center > q.side;
            rec.direction = centerBetter ? "center" : state.sideChoice;
            rec.alt = centerBetter ? state.sideChoice : "center";
            rec.dual = { stable: state.sideChoice, centerBetter, grand, q };
          } else if (grand.sd > CENTER_DATA_SD) {
            // 가운데 데이터가 쌓일 때까지는 가운데 추천
            rec.direction = "center";
          } else {
            // 수집 데이터로 추정한 대강하 비율 기준, 남은 강하 동안의 기대 보상이 더 크면 추천
            const q = makeSolver(grand.mean).Q(f, turnsForCalc);
            if (q.center > q.side) rec.direction = "center";
          }
        }

        rec.detail = moveText();

        rec.headline = `지금은 '${LABEL[rec.direction]}' 추천`;
        if (rec.dual) {
          const d = rec.dual;
          const stableName = LABEL[d.stable];
          rec.headline = d.centerBetter
            ? `지금은 '가운데' 추천 (도박) · 안정 선택은 '${stableName}'`
            : `지금은 '${stableName}' 추천 (안정) · 도박 선택은 '가운데'`;
          const grandPct = Math.round(d.grand.mean * 100);
          const hi = Math.max(d.q.center, d.q.side);
          const lo = Math.min(d.q.center, d.q.side);
          const gap = lo > 0 ? (hi - lo) / lo * 100 : 0;
          const gapText = gap < 1 ? "근소하게(1% 미만)" : `약 ${Math.round(gap)}%`;
          const where = r === null ? "남은 강하를 3회로 가정하면" : `이 층·남은 ${r}회에선`;
          rec.parts = [
            { text: `가운데: 대강하 약 ${grandPct}% · 상승 약 ${100 - grandPct}% (${d.grand.n ? `데이터 ${d.grand.n}건` : "데이터 없음, 기본값"})`, cls: "rec-line" },
            { text: `${where} ${d.centerBetter ? "도박" : "안정"} 쪽 기대 보상이 ${gapText} 높습니다.`, cls: "rec-line" }
          ];
        }
        rec.cheer = moveCheer(rec.direction, r) || CHEER_MESSAGES[rec.direction][state.cheerIndex % 3];
        state.rec = rec;
        if (!state.departureLocked) state.departureRec = rec;
        render();
      }

      // 연속 강하: 마지막 강하와 같은 층수로 몇 번 연속 내려왔는지 (상승이 끼면 끊긴 것으로 봄)
      function streakInfo() {
        const d = state.runDeltas;
        if (!d.length || !state.lastMove || state.lastMove.to !== state.floor) return null;
        const unit = d[d.length - 1];
        if (unit <= 0) return null;
        let count = 0;
        for (let i = d.length - 1; i >= 0 && d[i] === unit; i--) count++;
        return { unit, count };
      }

      /* ==============================================================
       * 7. 화면 갱신
       * ============================================================== */
      function render() {
        const rec = state.rec;
        if (!rec) return;

        el.floorDisplay.textContent = state.floor === null ? "-층" : floorText(state.floor);
        el.turnsDisplay.textContent = state.turns === null ? "-회" : `${state.turns}회`;
        el.reviveDisplay.textContent = state.revives === null ? "-회" : `${state.revives}회`;
        // 나락이면 보라색 테마, 가운데 칸은 '중단'(중단하고 보상 받기)으로 사용
        document.body.classList.toggle("abyss", Boolean(state.abyss));
        el.centerName.textContent = state.abyss ? "중단" : "가운데";

        const target = rec.direction === "stop" ? "center" : rec.direction;
        ["left", "center", "right"].forEach(dir => {
          const card = el.cards[dir];
          card.classList.remove("active", "alt", "center-gamble", "stop");
          if (rec.active && dir === target) {
            card.classList.add("active");
            if (rec.direction === "stop") card.classList.add("stop");
            else if (dir === "center") card.classList.add("center-gamble");
          } else if (rec.active && rec.alt === dir) {
            // 70층 이상: 추천과 함께 제시하는 다른 선택 (안정 또는 도박)
            card.classList.add("alt");
            if (dir === "center") card.classList.add("center-gamble");
          }
          let tag = "";
          if (rec.active && rec.dual) {
            const star = rec.direction === dir ? " ★추천" : "";
            if (dir === "center") tag = `도박${star}`;
            else if (dir === rec.dual.stable) tag = `안정${star}`;
          }
          if (el.tags[dir]) el.tags[dir].textContent = tag;
        });

        el.recHeadline.textContent = rec.headline;
        const altar = state.altarEffect && state.altarFloor === state.floor ? state.altarEffect : null;
        el.recDetail.textContent = "";
        if (altar) {
          const line = document.createElement("span");
          line.className = "altar-line";
          line.textContent = altar.name
            ? `제단 효과 '${altar.name}' 획득! ${altar.desc}. `
            : "제단 효과 획득! ";
          el.recDetail.appendChild(line);
        }
        const streak = streakInfo();
        const bonus = streak && streak.count >= 3;
        if (bonus || (streak && streak.count === 2 && rec.active && rec.direction !== "stop")) {
          const line = document.createElement("span");
          line.className = "streak-line";
          line.textContent = bonus
            ? `${streak.unit}층 ${streak.count}연속 강하! 연속 강하 보너스(골드·실링)가 이 층 바닥에 떨어집니다. `
            : `${streak.unit}층 2연속 강하 중! 다음 강하도 ${streak.unit}층이면 연속 강하 보너스를 받습니다. `;
          el.recDetail.appendChild(line);
        }
        if (rec.detail) el.recDetail.appendChild(document.createTextNode(rec.detail));
        (rec.parts || []).forEach(p => {
          if (!p.text) return;
          const span = document.createElement("span");
          if (p.cls) span.className = p.cls;
          span.textContent = `${p.text} `;
          el.recDetail.appendChild(span);
        });
        const death = rec.tone === "death";
        el.summaryCard.classList.toggle("altar", Boolean(altar) && !death);
        el.summaryCard.classList.toggle("streak", Boolean(bonus) && !altar && !death);
        el.summaryCard.classList.toggle("death", death);
        el.cheerText.textContent = bonus && !death
          ? "연속 강하 보너스 획득! 바닥에 떨어진 골드·실링 꼭 챙기세요!"
          : (altar && rec.active && rec.direction !== "stop" ? "제단 효과 획득! 운이 따르고 있습니다, 이대로 깊게 내려가 봅시다!" : rec.cheer);

        el.stateSummary.classList.toggle("mode-line", Boolean(state.abyss && state.stream));
        if (!state.stream) {
          el.stateSummary.textContent = "좌측 상단 HUD 자동 인식 대기";
        } else if (state.ocrFailed) {
          el.stateSummary.textContent = "HUD 인식 엔진을 불러오지 못했습니다 (새로고침 후 다시 시도)";
        } else if (!state.ocrReady) {
          el.stateSummary.textContent = "HUD 인식 준비 중…";
        } else if (state.abyss) {
          el.stateSummary.textContent = state.abyssSafe === null
            ? "나락 모드 · 생존 층 확인 중"
            : `나락 모드 · ${PARITY_NAME[state.abyssSafe]} 층 생존`;
        } else {
          el.stateSummary.textContent = "HUD 자동 인식 중";
        }
      }

      function setErrorState(title, detail) {
        el.liveDot.classList.remove("live");
        el.liveDot.classList.add("error");
        el.statusText.textContent = "공유 오류/제한됨";
        el.recHeadline.textContent = title;
        el.recDetail.textContent = detail;
      }

      /* ==============================================================
       * 8. HUD 판독 ('지하 N층', '강하 N회 가능')
       * ============================================================== */
      // 인식 엔진 준비 (페이지를 열 때 미리 시작, 중복 실행 방지)
      function initOcr() {
        if (state.ocrReady) return Promise.resolve();
        if (state.ocrLoading) return state.ocrLoading;
        if (!window.Tesseract) {
          state.ocrFailed = true;
          render();
          return Promise.resolve();
        }
        state.ocrFailed = false;
        state.ocrLoading = (async () => {
          try {
            const worker = await window.Tesseract.createWorker("kor", 1, { logger: () => {} });
            await worker.setParameters({
              tessedit_pageseg_mode: window.Tesseract.PSM.SPARSE_TEXT
            });
            state.ocrWorker = worker;
            state.ocrReady = true;
          } catch (err) {
            console.warn("OCR 초기화 실패:", err);
            state.ocrWorker = null;
            state.ocrFailed = true;
          } finally {
            state.ocrLoading = null;
            render();
          }
        })();
        return state.ocrLoading;
      }

      function prepareHighContrastHudCrop() {
        const videoEl = el.video;
        const vw = videoEl.videoWidth || 1280;
        const vh = videoEl.videoHeight || 720;
        // 좌측 상단 HUD: '지하 N층' 제목부터 '강하 N회 가능' 줄까지 크롭 및 확대 (아래 층 목록은 제외, 비율 유지)
        const sx = Math.floor(vw * 0.02);
        const sy = Math.floor(vh * 0.025);
        const sw = Math.floor(vw * 0.12);
        // 창 모드에서는 제목 표시줄만큼 HUD가 아래로 밀리므로 '강하 N회 가능' 줄이 잘리지 않게 여유를 둠 (아래 층 목록 글자는 제외되는 높이)
        const sh = Math.floor(vh * 0.265);
        const targetW = 480;
        const targetH = Math.max(120, Math.round(targetW * sh / sw));

        const c = el.hudCanvas;
        c.width = targetW;
        c.height = targetH;
        const hctx = c.getContext("2d", { willReadFrequently: true });
        hctx.drawImage(videoEl, sx, sy, sw, sh, 0, 0, targetW, targetH);

        const imgData = hctx.getImageData(0, 0, targetW, targetH);
        const d = imgData.data;
        const color = new Uint8ClampedArray(d); // 보조 판독용 원본 색
        const bits = new Uint8Array(targetW * targetH);
        // 밝은 글씨(흰색/금색)만 남겨 흰 바탕 검은 글씨로 변환 (OCR이 더 잘 읽는 형태)
        for (let y = 0; y < targetH; y++) {
          for (let x = 0; x < targetW; x++) {
            const i = (y * targetW + x) * 4;
            const bright = Math.max(d[i], d[i + 1], d[i + 2]) >= 150;
            const val = bright ? 0 : 255;
            d[i] = val;
            d[i + 1] = val;
            d[i + 2] = val;
            d[i + 3] = 255;
            bits[y * targetW + x] = bright ? 1 : 0;
          }
        }
        hctx.putImageData(imgData, 0, 0);
        return { canvas: c, bits, color, width: targetW, height: targetH, sx, sy, sw, sh, vw, vh };
      }

      /* OCR 줄 위치로 '강하 N회 가능' 줄과 '부활 횟수' 줄이 화면 어디에 있는지 찾음.
       * 게임을 창 모드(제목 표시줄 있음)로 띄우면 HUD가 아래로 밀려 고정 비율 위치로는 못 읽으므로,
       * 실제로 읽힌 줄을 기준으로 부활 횟수·홀짝 안내 문구 위치를 잡음 */
      function findHudAnchors(data, crop, out) {
        const scaleY = crop.sh / crop.height;
        (data && data.blocks || []).forEach(b => (b.paragraphs || []).forEach(p => (p.lines || []).forEach(l => {
          const t = l.text || "";
          if (!l.bbox) return;
          const y0 = crop.sy + l.bbox.y0 * scaleY;
          const y1 = crop.sy + l.bbox.y1 * scaleY;
          if (!out.turns && /[강감]\s?[하허]\s*\S{1,3}\s*[회희화외]|[회희화외]\s*[가기]\s?[능늠]/.test(t)) out.turns = { y0, y1 };
          if (!out.revive && /[부브]\s?[활화]\s?[횟회]|[횟회]\s?[수스]/.test(t)) out.revive = { y0, y1 };
        })));
        return out;
      }

      // 보조 판독용 회색조 이미지: 공유 화면은 색 정보가 절반 해상도로 줄어 전달되어
      // 금색 숫자(남은 강하 횟수)가 흑백 변환에서 깨질 수 있으므로, 밝기 기준 회색조로 한 번 더 읽음
      function makeGrayCanvas(crop, mode) {
        const cv = state.grayCanvas || (state.grayCanvas = document.createElement("canvas"));
        cv.width = crop.width;
        cv.height = crop.height;
        const ctx = cv.getContext("2d", { willReadFrequently: true });
        const out = ctx.createImageData(crop.width, crop.height);
        const src = crop.color, dst = out.data;
        const lo = mode === "luma" ? 60 : 70;
        const hi = mode === "luma" ? 200 : 210;
        if (mode === "color") {
          dst.set(src); // 게임 화면 색 그대로
          ctx.putImageData(out, 0, 0);
          return cv;
        }
        for (let i = 0; i < src.length; i += 4) {
          const v = mode === "luma"
            ? 0.299 * src[i] + 0.587 * src[i + 1] + 0.114 * src[i + 2]
            : Math.max(src[i], src[i + 1], src[i + 2]);
          const g = 255 - Math.min(255, Math.max(0, (v - lo) * 255 / (hi - lo)));
          dst[i] = dst[i + 1] = dst[i + 2] = g;
          dst[i + 3] = 255;
        }
        ctx.putImageData(out, 0, 0);
        return cv;
      }

      function countBitDiff(a, b) {
        if (!a || !b || a.length !== b.length) return Infinity;
        let diff = 0;
        for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) diff++;
        return diff;
      }

      // 숫자로 자주 잘못 읽히는 글자 보정
      function toNumber(token) {
        const t = token.replace(/[OoQDㅁㅇ口]/g, "0").replace(/[Il|\[\]!]/g, "1");
        return /^\d+$/.test(t) ? parseInt(t, 10) : null;
      }

      function parseHudText(rawText) {
        const text = (rawText || "").replace(/\s+/g, " ").trim();
        const NUM = "([0-9OoQDㅁㅇ口Il|\\[\\]!]{1,3})";
        // 남은 강하: '강하 N회 가능' ('강'을 '감'으로, '회'를 '희'로 읽는 경우 등 허용)
        const tm = text.match(new RegExp("[강감]\\s?[하허]\\s*" + NUM + "\\s*[회희화외]")) ||
          text.match(new RegExp(NUM + "\\s*[회희화외]\\s*[가기]\\s?[능늠]"));
        let turns = null;
        if (tm) {
          const t = toNumber(tm[1]);
          if (t !== null && t >= 0 && t <= 12) turns = t;
        }
        // 층수: '강하' 줄보다 위에 있는 제목에서만 읽음 ('층'을 '충'·'%' 등으로 읽는 경우 허용)
        const head = tm ? text.slice(0, tm.index) : text;
        let floor = null;
        const fm = head.match(new RegExp("지\\s?[하허히]\\s*" + NUM + "\\s*[층충총증%]"));
        if (fm) {
          const n = toNumber(fm[1]);
          if (n !== null && n >= 1 && n <= MAX_FLOOR) floor = n;
        } else if (/로\s?비/.test(head)) {
          floor = 0;
        }
        // 판이 끝나면 '중단하고 보상 받기' 자리에 '다시하기 / 나가기' 버튼이 나옴
        const ended = /나\s?가\s?기|다\s?시\s?하\s?기/.test(text);
        return { floor, turns, ended, abyss: isAbyssText(text), raw: text.slice(0, 80) };
      }

      // 나락 HUD에만 있는 글자: 위쪽 '나락', '부활 횟수' 줄 ('브화 회스' 등으로 읽히는 경우 허용)
      function isAbyssText(text) {
        return /나\s?락|부\s?활|[부브]\s?[활화]\s?[횟회]\s?[수스]|활\s?[횟회]\s?수/.test(text || "");
      }

      // 부활 횟수 줄: '부활 횟수 (구슬 아이콘) X 1' → 마지막 숫자 (0~3만 인정)
      function parseReviveText(rawText) {
        const t = (rawText || "").replace(/\s+/g, " ");
        const m = t.match(/[부브]\s?[활화]\s?[횟회]\s?[수스]|활\s?[횟회]\s?[수스]|[횟회]\s?수/);
        if (!m) return null;
        const tail = t.slice(m.index + m[0].length, m.index + m[0].length + 12);
        const digits = tail.match(/[0-9ㅣlI|]/g);
        if (!digits) return null;
        const c = digits[digits.length - 1];
        const n = /[ㅣlI|]/.test(c) ? 1 : parseInt(c, 10);
        return n >= 0 && n <= 3 ? n : null;
      }

      // 로비 안내 문구: '홀수 층은 생존, 짝수 층은 사망합니다.' → 1(홀수 생존) / 0(짝수 생존)
      function parseParityText(rawText) {
        const t = (rawText || "").replace(/\s+/g, "");
        const odd = t.match(/[홀흘횰]수.{0,4}?(생[존조]|사[망믿만])/);
        const even = t.match(/[짝짜쪽]수.{0,4}?(생[존조]|사[망믿만])/);
        const oddSafe = odd ? odd[1].startsWith("생") : null;
        const evenSafe = even ? even[1].startsWith("생") : null;
        const votesOdd = (oddSafe === true ? 1 : 0) + (evenSafe === false ? 1 : 0);
        const votesEven = (oddSafe === false ? 1 : 0) + (evenSafe === true ? 1 : 0);
        if (votesOdd && !votesEven) return 1;
        if (votesEven && !votesOdd) return 0;
        return null;
      }

      // 같은 값이 STABLE_READS번 읽혀야 확정 (못 읽은 프레임은 건너뜀)
      function stabilize(slot, value) {
        const s = state.read[slot];
        if (value === null) return null;
        if (s.value === value) s.hits++;
        else {
          s.value = value;
          s.hits = 1;
        }
        return s.hits >= STABLE_READS ? value : null;
      }

      function resetForNewRun() {
        state.runDeltas = [];
        state.ended = false;
        state.endedHits = 0;
        state.sideChoice = null;
        // 새 판의 HUD에서 이미 나락 글자가 연속으로 보였으면 바로 나락으로 시작
        state.abyss = false;
        state.abyssSafe = null;
        state.parityRead = { value: null, hits: 0 };
        state.revives = null;
        state.reviveRead = { value: null, hits: 0 };
        state.revivesAtArrival = null;
        state.deadlyArrivalAt = 0;
        state.abyssDeath = null;
        state.abyssFailed = false;
        if (state.abyssHits >= STABLE_READS) enterAbyss();
      }

      function enterAbyss() {
        state.abyss = true;
        if (state.revives === null) state.revives = ABYSS_DEFAULT_REVIVES; // 공식 규칙: 기본 부활 1회 (HUD를 읽으면 그 값으로 바뀜)
        state.lastSideOcrAt = 0; // 부활 횟수·홀짝 안내를 바로 읽음
        state.sideChoice = null;
      }

      // 나락 층 도착: 홀짝 규칙상 사망 층이면 부활 1회 사용 (부활이 없으면 보상 소멸)
      function abyssArrival(f) {
        state.abyssDeath = null;
        state.revivesAtArrival = state.revives;
        if (state.abyssSafe === null || f >= MAX_FLOOR || f % 2 === state.abyssSafe) return;
        state.deadlyArrivalAt = Date.now();
        const k = state.revives === null ? ABYSS_DEFAULT_REVIVES : state.revives;
        if (k > 0) {
          state.revives = k - 1;
          state.abyssDeath = { floor: f, revived: true };
        } else {
          state.abyssDeath = { floor: f, revived: false };
          state.abyssFailed = true;
        }
      }

      // 나락: 다음 강하를 시작했다 = 이 층에서 살아 있었다 → HUD 부활 횟수로 홀짝 규칙 확인·보정
      function verifyAbyssOnDeparture() {
        const f = state.floor;
        const s = state.reviveRead;
        const hud = s.hits >= STABLE_READS ? s.value : null;
        if (!f || f >= MAX_FLOOR || hud === null || state.revivesAtArrival === null) return;
        const died = hud < state.revivesAtArrival;
        if (state.abyssSafe === null) {
          state.abyssSafe = died ? 1 - (f % 2) : f % 2;
        } else if (!died && state.abyssDeath && state.abyssDeath.floor === f) {
          // 사망 층으로 계산했는데 부활 횟수가 그대로 → 홀짝 규칙을 잘못 읽은 것으로 보고 바로잡음
          state.abyssSafe = f % 2;
          state.abyssDeath = null;
          state.abyssFailed = false;
          state.revives = hud;
        }
      }

      // HUD에서 읽은 부활 횟수 반영 (2번 연속 같은 값일 때)
      function applyReviveReading(k) {
        if (k === null) return;
        const s = state.reviveRead;
        if (s.value === k) s.hits++;
        else {
          s.value = k;
          s.hits = 1;
        }
        if (s.hits < STABLE_READS || k === state.revives) return;
        const f = state.floor;
        if (state.revives === null) {
          state.revives = k;
        } else if (k < state.revives) {
          // 줄어든 값은 잘못 읽으면 '중단' 추천으로 바뀌므로 3번 연속 같을 때만 반영
          if (s.hits < STABLE_READS + 1) return;
          // 예상하지 못한 사망 (홀짝 규칙을 아직 몰랐던 경우 등) → 이번 층이 사망 층
          if (f && f < MAX_FLOOR && (state.abyssSafe === null || f % 2 !== state.abyssSafe)) {
            state.abyssSafe = 1 - (f % 2);
            state.abyssDeath = { floor: f, revived: true };
          }
          state.revives = k;
        } else {
          // HUD 값이 더 큼: 사망 층이면 부활 처리 전이라 HUD가 아직 이전 값 → 무시
          if (state.abyssDeath && state.abyssDeath.floor === f) return;
          const altarLife = f && f % 11 === 0 && state.altarFloor === f && k === state.revives + 1 &&
            Date.now() - state.arrivedAt < ALTAR_WATCH_MS + 5000;
          if (altarLife) state.altarEffect = ALTAR.life; // 특수층에서 부활 횟수 증가 = '생명+1'
          else if (s.hits < STABLE_READS + 1) return;
          state.revives = k;
        }
        refreshRecommendation(false);
      }

      // 로비 안내 문구로 읽은 생존 층 반영 (2번 연속 같은 값일 때)
      function applyParityReading(p) {
        if (p === null) return;
        const s = state.parityRead;
        if (s.value === p) s.hits++;
        else {
          s.value = p;
          s.hits = 1;
        }
        if (s.hits >= STABLE_READS && state.abyssSafe !== p) {
          state.abyssSafe = p;
          refreshRecommendation(false);
        }
      }

      // 층이 확정적으로 바뀌었을 때: 실제 가능한 이동이면 출발 당시 추천과 함께 기록하고 다음 추천
      function onFloorConfirmed(newFloor) {
        const prev = state.floor;
        if (prev === newFloor) return;
        const dep = state.departureRec;
        state.lastMove = null;
        if (prev !== null && dep && dep.active && dep.floor === prev && isPossibleMove(prev, newFloor)) {
          // 나락 이동은 지옥 통계(가운데 대강하 비율·좌우 비교)와 섞이지 않도록 서버에 기록하지 않음
          if (!state.abyss) {
            appendMoveRecord({
              floorBefore: prev,
              floorAfter: newFloor,
              direction: dep.direction,
              remainingTurns: dep.turns,
              gamble: isGamblePoint(prev)
            });
          }
          state.lastMove = { from: prev, to: newFloor, direction: dep.direction };
          if (newFloor % 11 === 0) {
            state.altarDepTurns = dep.turns;
            state.altarTurnsChecked = false;
          }
          state.runDeltas.push(newFloor - prev);
        } else if (prev !== null) {
          state.runDeltas = []; // 이동을 놓쳤으면 연속 기록을 알 수 없으므로 초기화
        }
        if (newFloor === 0) resetForNewRun();
        else if (state.abyss && prev !== null && newFloor > prev && isPossibleMove(prev, newFloor)) abyssArrival(newFloor);
        state.floor = newFloor;
        state.arrivedAt = Date.now();
        state.departureLocked = false;
        state.ended = false;
        state.endedHits = 0;
        refreshRecommendation(true);
      }

      function applyHudReading(parsed) {
        const floorC = stabilize("floor", parsed.floor);
        const turnsC = stabilize("turns", parsed.turns);
        const floorChanged = floorC !== null && floorC !== state.floor;
        let needRefresh = false;
        let newRun = false;

        // 나락 글자가 보인 연속 판독 수 (층·횟수를 다 읽었는데 안 보이면 0으로)
        if (parsed.abyss) state.abyssHits++;
        else if (parsed.floor !== null && parsed.turns !== null) state.abyssHits = 0;

        // 판 종료 버튼이 연속으로 보이면 이번 판 종료
        state.endedHits = parsed.ended ? state.endedHits + 1 : 0;
        if (!state.ended && !floorChanged && state.endedHits >= STABLE_READS) {
          state.ended = true;
          state.departureLocked = false;
          needRefresh = true;
        }

        // 강하 시작으로 판단했는데 한참 지나도 층이 안 바뀌면 (남은 횟수만 늦게 읽힌 경우) 판단 취소
        if (state.departureLocked && !floorChanged && Date.now() - state.lockedAt > DEPARTURE_TIMEOUT_MS) {
          state.departureLocked = false;
          needRefresh = true;
        }

        if (turnsC !== null && turnsC !== state.turns) {
          const prevTurns = state.turns;
          state.turns = turnsC;
          if (prevTurns !== null && turnsC >= prevTurns + 2) {
            // 남은 횟수가 크게 늘어남 = 새 열쇠로 입장 (로비)
            resetForNewRun();
            newRun = true;
          } else if (!floorChanged && prevTurns !== null && turnsC < prevTurns &&
                     Date.now() - state.arrivedAt > DEPARTURE_GAP_MS) {
            // 층은 그대로인데 횟수만 줄어듦 = 강하를 시작함 → 출발 당시 추천을 기록용으로 고정
            if (state.abyss) verifyAbyssOnDeparture();
            state.departureLocked = true;
            state.lockedAt = Date.now();
          }
          needRefresh = true; // 0회가 되면 추천 종료, 늘거나 늦게 읽힌 경우 다시 계산
        }

        // 나락 판단 (한 판 안에서는 유지, 새 판이 시작될 때 다시 판단)
        if (!state.abyss && state.abyssHits >= STABLE_READS) {
          enterAbyss();
          needRefresh = true;
        }

        if (floorChanged) {
          onFloorConfirmed(floorC);
        } else if (newRun) {
          state.lastMove = null;
          state.floor = 0;
          state.arrivedAt = Date.now();
          state.departureLocked = false;
          refreshRecommendation(true);
        } else if (needRefresh) {
          refreshRecommendation(false);
        } else {
          render();
        }
      }

      // 직전 판독에서 층수·남은 횟수 글자가 있던 줄만 비교 (HUD 장식이 움직여도 불필요한 OCR을 하지 않음)
      function hudChangedPixels(bits, width) {
        const prev = state.lastHudBits;
        if (!prev || prev.length !== bits.length) return Infinity;
        if (!state.watchBoxes) return countBitDiff(bits, prev);
        let diff = 0;
        for (const b of state.watchBoxes) {
          for (let y = b.y0; y < b.y1; y++) {
            for (let x = b.x0; x < b.x1; x++) {
              const i = y * width + x;
              if (bits[i] !== prev[i]) diff++;
            }
          }
        }
        return diff;
      }

      function findWatchBoxes(data, width, height) {
        const boxes = [];
        (data.blocks || []).forEach(b => (b.paragraphs || []).forEach(p => (p.lines || []).forEach(l => {
          if (!/층|충|총|증|%|로\s?비|회|희|가\s?능|지\s?옥|나\s?락|부\s?활/.test(l.text || "")) return;
          const m = 8;
          boxes.push({
            x0: Math.max(0, l.bbox.x0 - m), y0: Math.max(0, l.bbox.y0 - m),
            x1: Math.min(width, l.bbox.x1 + m), y1: Math.min(height, l.bbox.y1 + m)
          });
        })));
        return boxes.length ? boxes : null;
      }

      /* 11층 단위 제단 효과: 화면 가운데 위에 '"상자+1" 효과를 획득하였습니다' 같은 안내가 뜸.
       * 11층 단위 층에 도착한 뒤 잠깐 동안만 그 부분을 읽어, 공식 제단 효과 4종 중 무엇인지 알려 줌 */
      const ALTAR_WATCH_MS = 10000;
      const ALTAR = {
        boon: { name: "풍요", desc: "보상 상자 1개가 풍요 상자로 바뀝니다" },
        box: { name: "상자+1", desc: "종료 시 보상 상자가 1개 추가됩니다" },
        leap: { name: "최소 16층", desc: "다음 강하는 최소 16층 이상 내려갑니다" },
        turn: { name: "강하+1", desc: "강하 횟수가 1회 늘었습니다" },
        life: { name: "생명+1", desc: "부활 횟수가 1회 늘었습니다" } // 나락 전용
      };

      // 나락 HUD의 '부활 횟수 X N' 줄과 로비의 '홀수 층은 생존, 짝수 층은 사망합니다.' 문구 위치 (화면 비율)
      const REVIVE_BOX = { x: 0.01, y: 0.165, w: 0.12, h: 0.03 };
      const HINT_BOX = { x: 0.01, y: 0.335, w: 0.15, h: 0.055 };

      /* 부활 횟수 줄·홀짝 안내 문구를 읽을 위치 (화면 픽셀)
       * 1순위: '강하 N회 가능' 줄 기준 (부활 줄은 약 69px 위, 안내 문구는 약 128px 아래, 1080p 기준 — 전체 화면·창 모드 모두 같음)
       * 2순위: OCR로 찾은 '부활 횟수' 줄, 둘 다 없으면 고정 비율 위치 */
      function sideRects() {
        const v = el.video;
        const vw = v.videoWidth || 1280, vh = v.videoHeight || 720;
        const s = vh / 1080;
        const a = state.hudAnchor && state.hudAnchor.vh === vh ? state.hudAnchor : null;
        const turnsC = a && a.turns ? (a.turns.y0 + a.turns.y1) / 2 : null;
        let revive = { x: vw * REVIVE_BOX.x, y: vh * REVIVE_BOX.y, w: vw * REVIVE_BOX.w, h: vh * REVIVE_BOX.h };
        let hint = { x: vw * HINT_BOX.x, y: vh * HINT_BOX.y, w: vw * HINT_BOX.w, h: vh * HINT_BOX.h };
        let from = "고정";
        if (turnsC !== null) {
          revive = { x: vw * 0.01, y: turnsC - 85 * s, w: vw * 0.12, h: 32 * s };
          hint = { x: vw * 0.01, y: turnsC + 108 * s, w: vw * 0.15, h: 40 * s };
          from = "강하 줄";
        } else if (a && a.revive) {
          const c = (a.revive.y0 + a.revive.y1) / 2;
          revive = { x: vw * 0.01, y: c - 16 * s, w: vw * 0.12, h: 32 * s };
          from = "부활 줄";
        }
        return { revive, hint, from };
      }

      function recognizeBox(box, W, mode) {
        const v = el.video;
        const vw = v.videoWidth || 1280, vh = v.videoHeight || 720;
        return recognizeRect({ x: vw * box.x, y: vh * box.y, w: vw * box.w, h: vh * box.h }, W, mode);
      }

      // 화면 일부(픽셀 영역)를 잘라 읽음: luma = 밝기 기준 흑백(밝은 글씨 → 검은 글씨), color = 게임 화면 색 그대로
      async function recognizeRect(rect, W, mode) {
        const v = el.video;
        const vw = v.videoWidth || 1280, vh = v.videoHeight || 720;
        const sx = Math.max(0, Math.floor(rect.x)), sy = Math.max(0, Math.floor(rect.y));
        const sw = Math.max(1, Math.min(vw - sx, Math.floor(rect.w)));
        const sh = Math.max(1, Math.min(vh - sy, Math.floor(rect.h)));
        const H = Math.max(24, Math.round(W * sh / sw));
        const cv = state.sideCanvas || (state.sideCanvas = document.createElement("canvas"));
        cv.width = W;
        cv.height = H;
        const ctx = cv.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(v, sx, sy, sw, sh, 0, 0, W, H);
        if (mode === "luma") {
          const img = ctx.getImageData(0, 0, W, H);
          const d = img.data;
          for (let i = 0; i < d.length; i += 4) {
            const y = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
            const g = 255 - Math.min(255, Math.max(0, (y - 60) * 255 / 140));
            d[i] = d[i + 1] = d[i + 2] = g;
          }
          ctx.putImageData(img, 0, 0);
        }
        const { data } = await state.ocrWorker.recognize(cv);
        return data && data.text ? data.text : "";
      }

      // 1순위: '효과를 획득' 바로 앞의 효과 이름("상자+1", "강하+1" 등)으로 판정
      // 2순위: 이름을 못 읽었을 때만 설명 문구로 판정 (도착 시 함께 보이는 다른 글자의 '16층' 등에 속지 않도록 '최소'만 인정)
      function parseAltarText(rawText) {
        const t = (rawText || "").replace(/\s+/g, " ");
        const m = t.match(/효\s?과\s?를?\s?획\s?득/);
        if (!m) return null;
        // 따옴표 안의 효과 이름만 사용 (따옴표를 못 읽었으면 바로 앞 12글자)
        const before = t.slice(0, m.index);
        const q = before.match(/["“”‘’']\s*([^"“”‘’']{1,10}?)\s*["“”‘’']?\s*$/);
        const name = q ? q[1] : before.slice(-12);
        if (/풍\s?요/.test(name)) return ALTAR.boon;
        if (/상\s?자/.test(name)) return ALTAR.box;
        if (/생\s?명/.test(name)) return ALTAR.life;
        if (/최\s?소/.test(name)) return ALTAR.leap;
        if (/강\s?하/.test(name)) return ALTAR.turn;
        if (/1\s?6/.test(name)) return ALTAR.leap;
        if (/풍\s?요/.test(t)) return ALTAR.boon;
        if (/상\s?자/.test(t)) return ALTAR.box;
        if (/생\s?명|부\s?활/.test(t)) return ALTAR.life;
        if (/최\s?소/.test(t)) return ALTAR.leap;
        if (/횟\s?수|기\s?회/.test(t)) return ALTAR.turn;
        return { name: null, desc: "" };
      }

      async function readAltarBanner() {
        const v = el.video;
        const vw = v.videoWidth || 1280, vh = v.videoHeight || 720;
        // 창 모드(제목 표시줄)로 화면이 아래로 밀려도 안내 줄이 들어오도록 위아래 여유를 둠
        const sx = Math.floor(vw * 0.34), sy = Math.floor(vh * 0.105);
        const sw = Math.floor(vw * 0.32), sh = Math.floor(vh * 0.11);
        const W = 760, H = Math.max(60, Math.round(W * sh / sw));
        const cv = state.bannerCanvas || (state.bannerCanvas = document.createElement("canvas"));
        cv.width = W;
        cv.height = H;
        const ctx = cv.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(v, sx, sy, sw, sh, 0, 0, W, H);
        const img = ctx.getImageData(0, 0, W, H);
        const d = img.data;
        for (let i = 0; i < d.length; i += 4) {
          const y = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
          const g = 255 - Math.min(255, Math.max(0, (y - 60) * 255 / 140));
          d[i] = d[i + 1] = d[i + 2] = g;
        }
        ctx.putImageData(img, 0, 0);
        const { data } = await state.ocrWorker.recognize(cv);
        return parseAltarText(data && data.text ? data.text : "");
      }

      // 문제 확인용 화면: 주소 끝에 ?debug=1 을 붙였을 때만 보임 (일반 사용자에게는 표시 안 함)
      let debugBox = null;
      if (DEBUG) {
        debugBox = document.createElement("div");
        debugBox.style.cssText = "background:#10141e;border:1px dashed #2d374e;border-radius:12px;padding:10px 12px;" +
          "font-size:12px;color:#8f9bb3;display:flex;gap:12px;align-items:flex-start;";
        debugBox.innerHTML = '<canvas width="150" height="172" style="border:1px solid #2b344b;border-radius:6px;background:#fff;flex-shrink:0"></canvas>' +
          '<div style="display:flex;flex-direction:column;gap:4px;min-width:0;word-break:break-all;line-height:1.4"></div>';
        document.querySelector(".wrap").appendChild(debugBox);
        debugBox.lastChild.textContent = `${APP_VERSION} · 문제 확인 모드`;
      }

      function updateDebug(canvas, parsed, reused) {
        if (!debugBox) return;
        const cv = debugBox.firstChild;
        const ctx = cv.getContext("2d");
        cv.height = Math.round(cv.width * canvas.height / canvas.width);
        ctx.drawImage(canvas, 0, 0, cv.width, cv.height);
        const v = el.video;
        const show = x => (x === null ? "-" : x);
        debugBox.lastChild.innerHTML = "";
        [
          `${APP_VERSION} · 공유 화면 ${v.videoWidth}×${v.videoHeight}`,
          `읽은 글자${reused ? "(변화 없음)" : ""}${parsed.assisted ? "(보조 판독 사용)" : ""}: ${parsed.raw || "없음"}`,
          `이번 판독: ${show(parsed.floor)}층 / ${show(parsed.turns)}회${parsed.ended ? " · 종료 버튼" : ""} → 확정: ${show(state.floor)}층 / ${show(state.turns)}회${state.ended ? " · 판 종료" : ""}`,
          `제단: ${state.altarEffect ? (state.altarEffect.name || "효과") + " 확인" : (Date.now() < state.altarUntil ? state.altarFloor + "층 안내 확인 중" : "-")}`,
          `나락: ${state.abyss ? "예" : "아니오"} · 생존 층 ${state.abyssSafe === null ? "-" : PARITY_NAME[state.abyssSafe]}` +
            ` · 부활 ${show(state.revives)} (HUD ${show(state.reviveRead.value)}/${state.reviveRead.hits})` +
            `${state.abyssFailed ? " · 보상 소멸" : ""}`,
          `줄 위치: 강하 ${state.hudAnchor && state.hudAnchor.turns ? Math.round(state.hudAnchor.turns.y0) : "-"}` +
            ` · 부활 ${state.hudAnchor && state.hudAnchor.revive ? Math.round(state.hudAnchor.revive.y0) : "-"}` +
            ` · 부활 판독 ${state.sideText.revive || "-"} · 안내 ${state.sideText.hint || "-"}` +
            ` · 화면 ${document.visibilityState}`,
          `데이터: 수집 기록 ${state.remote ? state.remote.length + "건" : "없음"} · 마지막 번호 ${state.remoteMaxId || "-"} · ${state.dbStatus}`
        ].forEach(t => {
          const line = document.createElement("span");
          line.textContent = t;
          debugBox.lastChild.appendChild(line);
        });
      }

      async function captureTick() {
        if (state.isBusy || !state.stream || !el.video || el.video.readyState < 2) return;
        if (!state.ocrReady) return;
        state.isBusy = true;
        try {
          const crop = prepareHighContrastHudCrop();
          const width = crop.canvas.width;
          let parsed;
          const now = Date.now();
          const last = state.lastParsed;
          const incomplete = !last || last.floor === null || last.turns === null;
          const canReuse = last &&
            (incomplete ? now - state.lastOcrAt < RETRY_OCR_MS : now - state.lastOcrAt < FORCE_OCR_MS) &&
            hudChangedPixels(crop.bits, width) < HUD_SAME_PIXELS;
          if (canReuse) {
            parsed = last; // 글자 변화 없음 → 직전 판독 결과 재사용
          } else {
            state.lastOcrAt = now;
            const { data } = await state.ocrWorker.recognize(crop.canvas, {}, { text: true, blocks: true });
            const text = data && data.text ? data.text : "";
            parsed = parseHudText(text);
            if (parsed.ended && parsed.turns === null) parsed.turns = 0; // 판 종료 화면 = 남은 강하 0회
            const anchors = findHudAnchors(data, crop, {});
            // 글자 줄은 보이는데 숫자를 못 읽었으면 회색조 → 원본 색 그대로 순서로 다시 읽어 빈 값만 채움
            for (const mode of ["luma", "max", "color"]) {
              const needTurns = parsed.turns === null && /[강감]\s?[하허]|가\s?[능늠]/.test(text);
              // '강하 N회' 줄이 보이면 HUD가 떠 있는 것이므로 제목(층수)이 깨져 읽혀도 다시 읽음 (나락 HUD 배경이 밝아 깨지기 쉬움)
              const needFloor = parsed.floor === null && (parsed.turns !== null || /지\s?[하허히]|로\s?비/.test(text));
              if (!needTurns && !needFloor) break;
              const r2 = await state.ocrWorker.recognize(makeGrayCanvas(crop, mode), {}, { text: true, blocks: true });
              const p2 = parseHudText(r2.data && r2.data.text ? r2.data.text : "");
              if (needTurns && p2.turns !== null) { parsed.turns = p2.turns; parsed.assisted = true; }
              if (needFloor && p2.floor !== null) { parsed.floor = p2.floor; parsed.assisted = true; }
              if (p2.abyss) parsed.abyss = true;
              findHudAnchors(r2.data, crop, anchors);
            }
            if (anchors.turns || anchors.revive) state.hudAnchor = { ...anchors, vh: crop.vh, at: now };
            state.lastParsed = parsed;
            state.lastHudBits = crop.bits;
            state.watchBoxes = findWatchBoxes(data || {}, width, crop.canvas.height);
          }
          // 11층 단위 층에 도착하면 제단 안내를 잠깐 동안 확인
          if (parsed.floor && parsed.floor % 11 === 0 && parsed.floor !== state.altarFloor) {
            state.altarFloor = parsed.floor;
            state.altarUntil = Date.now() + ALTAR_WATCH_MS;
            state.altarEffect = null;
          }
          applyHudReading(parsed);
          // 나락: 부활 횟수 줄과 로비의 홀짝 안내 문구를 따로 잘라 읽음 (일정 간격)
          // 층·횟수가 바뀌는 중(확정 전)이면 확정 판독을 먼저 하도록 이번에는 건너뜀
          const pendingChange = (parsed.floor !== null && parsed.floor !== state.floor) ||
            (parsed.turns !== null && parsed.turns !== state.turns);
          if (state.abyss && !pendingChange && Date.now() - state.lastSideOcrAt >= ABYSS_SIDE_OCR_MS) {
            state.lastSideOcrAt = Date.now();
            const rects = sideRects();
            if (state.abyssSafe === null) {
              const hintText = await recognizeRect(rects.hint, 720, "color");
              state.sideText.hint = hintText.replace(/\s+/g, " ").trim().slice(0, 40);
              applyParityReading(parseParityText(hintText));
            }
            let reviveText = await recognizeRect(rects.revive, 480, "luma");
            let k = parseReviveText(reviveText);
            if (k === null) {
              reviveText = await recognizeRect(rects.revive, 480, "color");
              k = parseReviveText(reviveText);
            }
            state.sideText.revive = `${rects.from}: ${reviveText.replace(/\s+/g, " ").trim().slice(0, 30)}`;
            applyReviveReading(k);
          }
          if (!state.altarEffect && Date.now() < state.altarUntil) {
            const effect = await readAltarBanner();
            if (effect) {
              state.altarEffect = effect;
              render();
            }
          }
          // 제단 층 도착 3초 뒤 남은 강하가 출발 때와 같으면(원래는 1 줄어야 함) '강하+1' 확정
          if (state.floor && state.floor % 11 === 0 && state.altarFloor === state.floor && !state.altarTurnsChecked &&
              Date.now() - state.arrivedAt >= 3000) {
            state.altarTurnsChecked = true;
            if (state.altarDepTurns !== null && state.turns !== null && state.turns === state.altarDepTurns) {
              state.altarEffect = ALTAR.turn;
              render();
            }
          }
          updateDebug(crop.canvas, parsed, canReuse);
        } catch (err) {
          console.warn("HUD 판독 중 오류:", err);
        } finally {
          state.isBusy = false;
        }
      }

      /* ==============================================================
       * 9. 화면 공유
       * ============================================================== */
      async function startShare() {
        if (!window.isSecureContext) {
          setErrorState("보안(HTTPS) 환경이 아닙니다", "HTTPS로 서비스되는 독립 페이지에서 열어주세요.");
          return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
          setErrorState("이 브라우저/프레임에서는 화면 공유가 차단되어 있습니다", "독립 HTTPS 주소로 직접 열어주세요.");
          return;
        }

        try {
          const stream = await navigator.mediaDevices.getDisplayMedia({
            video: { frameRate: { ideal: 10, max: 15 } },
            audio: false
          });

          state.stream = stream;
          el.video.srcObject = stream;
          if (el.video.play) el.video.play().catch(() => {});

          el.liveDot.classList.remove("error");
          el.liveDot.classList.add("live");
          el.statusText.textContent = "자동 HUD 인식 중";
          el.toggleShareBtn.textContent = "공유 중지";

          const track = stream.getVideoTracks()[0];
          if (track) track.addEventListener("ended", () => stopShare(false));

          startTicker();
          refreshRecommendation(false);
          initOcr();
        } catch (err) {
          const errName = err && err.name ? err.name : "Error";
          const errMsg = err && err.message ? err.message : "권한이 거부되었거나 차단되었습니다.";
          stopShare(true);
          setErrorState(`화면 공유 시작 실패 (${errName})`, errMsg);
        }
      }

      /* 판독 주기: 브라우저 창이 게임 창에 가려지면 브라우저가 페이지 타이머를 크게 늦추므로(최대 1분에 1번)
       * Web Worker 타이머로 주기를 돌려 가려져 있어도 계속 읽음. Worker를 못 쓰면 일반 타이머 사용 */
      function startTicker() {
        stopTicker();
        try {
          const src = "let t=null;onmessage=e=>{clearInterval(t);if(e.data>0)t=setInterval(()=>postMessage(0),e.data);};";
          const url = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
          const w = new Worker(url);
          URL.revokeObjectURL(url);
          w.onmessage = () => captureTick();
          w.onerror = () => {
            stopTicker();
            state.timerId = setInterval(captureTick, OCR_INTERVAL_MS);
          };
          w.postMessage(OCR_INTERVAL_MS);
          state.ticker = w;
        } catch (err) {
          state.timerId = setInterval(captureTick, OCR_INTERVAL_MS);
        }
      }

      function stopTicker() {
        if (state.ticker) {
          try { state.ticker.terminate(); } catch {}
          state.ticker = null;
        }
        clearInterval(state.timerId);
        state.timerId = null;
      }

      // 다시 보이게 되면 바로 한 번 읽음
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && state.stream) captureTick();
      });

      function stopShare(keepErrorDot = false) {
        stopTicker();

        if (state.stream) {
          state.stream.getTracks().forEach(t => {
            try { t.stop(); } catch {}
          });
          state.stream = null;
        }
        el.video.srcObject = null;
        state.read.floor = { value: null, hits: 0 };
        state.read.turns = { value: null, hits: 0 };
        state.reviveRead = { value: null, hits: 0 };
        state.parityRead = { value: null, hits: 0 };
        state.lastParsed = null;
        state.lastHudBits = null;
        state.watchBoxes = null;

        el.liveDot.classList.remove("live");
        if (!keepErrorDot) el.liveDot.classList.remove("error");
        if (!keepErrorDot) el.statusText.textContent = "화면 공유 대기 중";
        el.toggleShareBtn.textContent = "화면 공유 시작";
        if (!keepErrorDot) render();
      }

      el.toggleShareBtn.addEventListener("click", () => {
        if (state.stream) stopShare(false);
        else startShare();
      });

      refreshRecommendation(false);
      initOcr();
      fetchRemoteRecords();
      state.remoteTimerId = setInterval(fetchRemoteRecords, REMOTE_REFRESH_MS);
    })();
  </script>
</body>
</html>
