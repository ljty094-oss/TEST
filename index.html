<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지옥 강하 추천기 (초단순 기록형)</title>
  <style>
    :root {
      --bg: #0c0e14;
      --card: #151924;
      --border: #272e40;
      --text: #f3f5fa;
      --muted: #8f9bb3;
      --accent: #4f8cff;
      --gold: #f5b942;
      --ok: #2ecc71;
      --err: #ff6b6b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .wrap {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 18px;
    }

    .status-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .status-title {
      font-size: 13px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64708a;
      display: inline-block;
    }

    .dot.live {
      background: var(--ok);
      box-shadow: 0 0 8px var(--ok);
    }

    .dot.error {
      background: var(--err);
      box-shadow: 0 0 8px var(--err);
    }

    .meta-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .floor-badge {
      background: #1b2234;
      border: 1px solid #2e3a54;
      color: var(--text);
      border-radius: 12px;
      padding: 8px 12px;
      text-align: center;
      min-width: 78px;
    }

    .floor-badge .label {
      display: block;
      font-size: 11px;
      color: var(--muted);
    }

    .floor-badge .value {
      display: block;
      font-size: 18px;
      font-weight: 800;
      color: #8ab4ff;
      margin-top: 2px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      border: 1px solid var(--border);
      background: #1d2332;
      color: var(--text);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }

    button:hover {
      border-color: var(--accent);
      background: #232b3e;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.primary:hover {
      background: #3b7af5;
    }

    button.danger {
      background: transparent;
      color: var(--muted);
      padding: 8px 12px;
      font-size: 12px;
    }

    .direction-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .dir-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 28px 12px;
      text-align: center;
      transition: 0.2s ease;
      opacity: 0.55;
    }
