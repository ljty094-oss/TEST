<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지옥 강하 추천기 (자동 HUD 인식형)</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #0c0e14;
      --card: #151924;
      --border: #272e40;
      --text: #f3f5fa;
      --muted: #8f9bb3;
      --accent: #4f8cff;
      --gold: #f5b942;
      --ok: #2ecc71;
      --err: #ff6b6b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .wrap {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 18px;
    }

    .status-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .status-title {
      font-size: 13px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64708a;
      display: inline-block;
    }

    .dot.live {
      background: var(--ok);
      box-shadow: 0 0 8px var(--ok);
    }

    .dot.error {
      background: var(--err);
      box-shadow: 0 0 8px var(--err);
    }

    .meta-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .floor-badge {
      background: #1b2234;
      border: 1px solid #2e3a54;
      color: var(--text);
      border-radius: 12px;
      padding: 8px 12px;
      text-align: center;
      min-width: 76px;
    }

    .floor-badge .label {
      display: block;
      font-size: 11px;
      color: var(--muted);
    }

    .floor-badge .value {
      display: block;
      font-size: 18px;
      font-weight: 800;
      color: #8ab4ff;
      margin-top: 2px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      border: 1px solid var(--border);
      background: #1d2332;
      color: var(--text);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }

    button:hover {
      border-color: var(--accent);
      background: #232b3e;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.primary:hover {
      background: #3b7af5;
    }


    .direction-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .dir-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 28px 12px;
      text-align: center;
      transition: 0.2s ease;
      opacity: 0.55;
    }

    .dir-card.active {
      opacity: 1;
      border-color: var(--accent);
      background: linear-gradient(180deg, rgba(79, 140, 255, 0.22), var(--card));
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
    }

    .dir-card.active.center-gamble {
      border-color: var(--gold);
      background: linear-gradient(180deg, rgba(245, 185, 66, 0.22), var(--card));
    }

    .dir-name {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    /* 70층 이상 10층 단위 층: 추천(진하게) + 함께 제시하는 다른 선택(점선) */
    .dir-card.alt {
      opacity: 0.9;
      border-style: dashed;
      border-color: rgba(79, 140, 255, 0.75);
    }

    .dir-card.alt.center-gamble {
      border-color: rgba(245, 185, 66, 0.85);
    }

    .dir-tag {
      margin-top: 8px;
      font-size: 15px;
      font-weight: 700;
      color: #a7c7ff;
    }

    .dir-tag:empty {
      display: none;
    }

    .dir-card.center-gamble .dir-tag {
      color: var(--gold);
    }

    .rec-line {
      display: block;
    }



    .summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .summary-card.altar {
      border-color: var(--gold);
      box-shadow: 0 0 14px rgba(245, 185, 66, 0.25);
    }

    .altar-line {
      color: var(--gold);
    }

    .summary-card.streak {
      border-color: var(--ok);
      box-shadow: 0 0 14px rgba(46, 204, 113, 0.22);
    }

    .streak-line {
      color: #7ee2a8;
    }

    .rec-headline {
      font-size: 16px;
      font-weight: 700;
    }

    .rec-detail {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }

    .rec-detail:empty {
      display: none;
    }

    .cheer-line {
      font-size: 13px;
      color: #a7c7ff;
      font-weight: 600;
      margin-top: 2px;
    }

    /* 나락 모드: 게임 화면처럼 보라색 테마로 전환 */
    body.abyss {
      --bg: #0d0a1c;
      --card: #171330;
      --border: #2e2650;
      --accent: #9a6bff;
    }

    body.abyss .floor-badge {
      background: #1d1838;
      border-color: #3a2f66;
    }

    body.abyss .floor-badge .value {
      color: #c7a6ff;
    }

    body.abyss .dir-card.active {
      background: linear-gradient(180deg, rgba(154, 107, 255, 0.24), var(--card));
    }

    body.abyss button.primary:hover {
      background: #8a5af0;
    }

    body.abyss .cheer-line {
      color: #cdb6ff;
    }

    .dir-card.active.stop,
    body.abyss .dir-card.active.stop {
      border-color: #ff7a59;
      background: linear-gradient(180deg, rgba(255, 122, 89, 0.24), var(--card));
    }

    .revive-badge {
      display: none;
    }

    body.abyss .revive-badge {
      display: block;
    }

    .mode-line {
      color: #c7a6ff;
      font-weight: 700;
    }

    .summary-card.death {
      border-color: #ff7a59;
      box-shadow: 0 0 14px rgba(255, 122, 89, 0.22);
    }

    .death-line {
      color: #ff9a85;
    }

    .survive-line {
      color: #8fe3b0;
    }






    .hidden-capture {
      display: none;
    }

    /* display:none 영상은 일부 브라우저에서 프레임 갱신이 멈출 수 있어 화면 밖에 1px로 둡니다 */
    .offscreen-video {
      position: fixed;
      left: -10px;
      top: -10px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <div class="status-group">
        <div class="status-title">
          <span id="liveDot" class="dot"></span>
          <span id="statusText">화면 공유 대기 중</span>
        </div>
        <div id="stateSummary" class="meta-sub">좌측 상단 HUD 자동 인식 대기</div>
      </div>
      <div class="btn-row">
        <div class="floor-badge">
          <span class="label">현재 층수</span>
          <span id="floorDisplay" class="value">-층</span>
        </div>
        <div class="floor-badge">
          <span class="label">남은 강하</span>
          <span id="turnsDisplay" class="value">-회</span>
        </div>
        <div class="floor-badge revive-badge">
          <span class="label">부활</span>
          <span id="reviveDisplay" class="value">-회</span>
        </div>
        <button id="toggleShareBtn" class="primary" type="button">화면 공유 시작</button>
      </div>
    </div>

    <div class="direction-grid">
      <div id="card-left" class="dir-card">
        <div class="dir-name">왼쪽</div>
        <div id="tag-left" class="dir-tag"></div>
      </div>
      <div id="card-center" class="dir-card">
        <div id="centerName" class="dir-name">가운데</div>
        <div id="tag-center" class="dir-tag"></div>
      </div>
      <div id="card-right" class="dir-card">
        <div class="dir-name">오른쪽</div>
        <div id="tag-right" class="dir-tag"></div>
      </div>
    </div>

    <div class="summary-card">
      <div id="recHeadline" class="rec-headline">공유를 시작하면 자동으로 추천합니다</div>
      <div id="recDetail" class="rec-detail"></div>
      <div id="cheerText" class="cheer-line">오늘도 대박 층수 노려봅시다!</div>
    </div>

  </div>

  <video id="hiddenVideo" class="offscreen-video" autoplay muted playsinline></video>
  <canvas id="hudCanvas" class="hidden-capture"></canvas>

  <script>
    (function () {
      "use strict";

      /* ==============================================================
       * 1. 설정
       * ============================================================== */
      const STORAGE_KEY = "hell_descent_records_v2"; // v2: 실제 층 이동만 기록 (v1 기록은 사용 안 함)
      const USER_ID_KEY = "hell_descent_user_id_v1";
      const EXTERNAL_DB_CONFIG = {
        supabaseUrl: "https://ggbsbxsppkpewultsmiz.supabase.co",
        supabaseAnonKey: "sb_publishable_XGuZI--CLpwE5UliON-8Ew_Qx2GhSkM",
        supabaseTable: "hell_descent_records",
        customPostUrl: ""
      };
      // 이전 버전(v11)이 저장한 기록은 실제 층 이동이 아니어서 통계에서 제외합니다. (2026-11-22 00:00 KST 이후만 사용)
      const DATA_SINCE = "2026-11-21T15:00:00Z";

      const OCR_INTERVAL_MS = 500;    // HUD 판독 주기
      const STABLE_READS = 2;         // 같은 값이 연속 2번 읽혀야 확정 (강하 연출 중 오인식 방지)
      const HUD_SAME_PIXELS = 25;     // 글자 줄에서 바뀐 픽셀이 이보다 적으면 OCR 생략 (숫자 한 글자 변화는 수십~수백 픽셀)
      const DEPARTURE_GAP_MS = 2500;  // 층 도착 후 이 시간이 지나 남은 횟수가 줄면 '강하 시작'으로 판단
      const RETRY_OCR_MS = 1000;      // 층수나 남은 횟수를 못 읽은 상태면 화면 변화와 관계없이 이 간격으로 다시 읽음
      const FORCE_OCR_MS = 3000;      // 화면 변화가 없어 보여도 이 간격마다 한 번은 다시 읽음 (놓친 변화 보정)
      const DEPARTURE_TIMEOUT_MS = 12000; // '강하 시작'으로 판단한 뒤 이 시간 안에 층이 안 바뀌면 판단 취소
      const REMOTE_REFRESH_MS = 60000;
      const REMOTE_PAGE_SIZE = 1000;
      const REMOTE_MAX_PAGES = 10;
      // 첫 접속 때만 전체 기록을 받고, 이후에는 새 기록(번호가 더 큰 기록)만 받음.
      // 거의 동시에 저장된 기록이 조금 늦게 보이는 경우를 대비해 마지막 번호보다 이만큼 앞부터 다시 확인 (겹치는 기록은 1건으로 처리)
      const REMOTE_ID_OVERLAP = 20;
      // 같은 사람의 같은 이동(출발층→도착층)이 이 시간 안에 또 기록되면 중복으로 보고 1건만 반영
      const DUPLICATE_MOVE_MS = 3000;
      // 이 층 이상 10층 단위 층(70·80·90층)에서는 안정(왼쪽/오른쪽 중 1곳)·도박(가운데)을 함께 제시하고,
      // 데이터 수집 중이어도 남은 강하 횟수까지 계산해 유리한 쪽을 추천으로 강조
      const DUAL_MIN_FLOOR = 70;

      /* 공식 규칙 — 로스트아크 공식 게임 가이드 '낙원', 2025-09-09 업데이트 공지
       * - 왼쪽/오른쪽: 1~20층 무작위, 각 층 확률 동일
       * - 가운데(10층 단위 층에서만 등장): 대강하 15~20층 또는 상승 1~5층, 각 범위 안에서 균등
       *   대강하/상승이 나올 비율은 미공개 → 수집 데이터로 추정
       * - 보상 단계 = 도달 층의 10의 자리 (0~10단계) */
      const MAX_FLOOR = 100;
      const SIDE_MIN = 1, SIDE_MAX = 20;
      const GRAND_MIN = 15, GRAND_MAX = 20;
      const ASCENT_MIN = 1, ASCENT_MAX = 5;

      /* 단계별 보상 가치 — loagg.com 지옥 보상표의 귀속 골드(1730 기준) 0·5·10단계 4,500 / 22,000 / 130,000G,
       * 사이 단계는 기하 보간. 레벨 구간이 달라도 단계 간 비율은 거의 같아 추천 결과에 영향이 없습니다. */
      const STAGE_VALUE = (function () {
        const a0 = 4500, a5 = 22000, a10 = 130000;
        const v = [];
        for (let s = 0; s <= 10; s++) {
          v.push(s <= 5 ? a0 * Math.pow(a5 / a0, s / 5) : a5 * Math.pow(a10 / a5, (s - 5) / 5));
        }
        return v;
      })();

      // 왼쪽/오른쪽 비교 기준값: 1~20층 균등분포 (평균 10.5, 표준편차 약 5.77)
      const SIDE_PRIOR_MEAN = 10.5;
      const SIDE_SD = Math.sqrt((20 * 20 - 1) / 12);
      const SIDE_PRIOR_N = 40;
      const SIDE_DIFF_Z = 2.5; // 수집 데이터에서 이 이상 차이가 나야 한쪽이 더 유리하다고 판단
      // 가운데 데이터가 쌓일 때까지(대강하 비율 추정 오차가 이보다 클 때, 가운데 결과 약 50~60건)는
      // 가운데 선택지가 나오면 가운데를 추천해 데이터를 모으고, 그 뒤로는 데이터 기준 최선만 추천
      const CENTER_DATA_SD = 0.07;

      /* 나락 — 로스트아크 공식 11/12 업데이트 공지, 게임 가이드 '낙원'
       * - 화염 열쇠: 짝수 층 생존·홀수 층 사망 / 서리 열쇠: 홀수 층 생존·짝수 층 사망 (서리라도 100층은 생존)
       * - 기본 부활 1회, 부활 횟수를 다 쓴 상태에서 사망하면 보상 기회 소멸
       * - '중단하고 보상 받기'를 누르면 현재 층 보상을 받고 종료, 보상은 10층 단위로 강화
       * - 가운데(대강하/상승) 없음 → 왼쪽/오른쪽 1~20층, 보상 구조는 같은 레벨 지옥과 같아 단계별 가치는 지옥 기준 사용
       * - 11층 단위 특수층(생존 층에만 등장): 상자+1, 강하+1, 최소 16층(로켓 점프), 생명+1 */
      const ABYSS_DEFAULT_REVIVES = 1;
      const LEAP_MIN = 16, LEAP_MAX = 20;  // '최소 16층' 효과: 다음 강하 16~20층
      const ABYSS_SIDE_OCR_MS = 1500;      // 부활 횟수·홀짝 안내 문구를 다시 읽는 간격
      const DEATH_HUD_GRACE_MS = 10000;    // 사망 층 도착 뒤 HUD의 부활 횟수가 늦게 바뀌는 동안은 이전 값 무시

      const APP_VERSION = "ver.20";
      const DEBUG = new URLSearchParams(window.location.search).get("debug") === "1";

      const LABEL = { left: "왼쪽", center: "가운데", right: "오른쪽", stop: "중단하고 보상 받기" };
      const PARITY_NAME = ["짝수", "홀수"];

      // 직전 강하 결과에 따라 사람처럼 반응하는 멘트 ({d} 내려온 층수, {n} 올라간 층수, {remain} 남은 횟수 안내, {dirRo} 추천 방향)
      const DIR_RO = { left: "왼쪽으로", center: "가운데로", right: "오른쪽으로" };
      const MOVE_CHEERS = {
        ascent: [
          "아, {n}층 위로 올라가 버렸네요… 이번엔 운이 따라주지 않았어요. {remain}{dirRo} 다시 내려가 봅시다!",
          "상승이 나와 버렸네요, 정말 아쉬워요. 이번엔 제대로 추천해 볼게요. {dirRo} 가 봅시다!"
        ],
        tiny: [
          "앗, {d}층밖에 못 내려왔네요… 이번엔 제대로 추천해 볼게요. {dirRo} 가 봅시다!",
          "{d}층이라니, 제 추천이 빗나갔네요. 이번엔 {dirRo} 크게 노려봅시다!",
          "아쉽게 {d}층에 그쳤어요. {remain}{dirRo} 가 봅시다!"
        ],
        small: [
          "{d}층, 조금 아쉬운 강하였어요. {remain}이번엔 {dirRo} 더 깊이 가 봅시다!",
          "{d}층 내려왔어요. 나쁘진 않지만 아쉽네요, {dirRo} 더 욕심내 봅시다!"
        ],
        good: [
          "{d}층, 괜찮게 내려왔어요! 이 흐름 그대로 {dirRo} 가 봅시다!",
          "{d}층 강하, 좋습니다! {dirRo} 쭉 이어가 봅시다!"
        ],
        great: [
          "{d}층 대박 강하! 이 기세로 {dirRo} 더 깊이 가 봅시다!",
          "와, {d}층이나 내려왔어요! 오늘 운이 좋네요. {dirRo} 가 봅시다!"
        ],
        grand: [
          "대강하 성공! {d}층을 한 번에 내려왔어요. 이 기세로 {dirRo} 가 봅시다!"
        ]
      };

      function moveCheer(direction, turns) {
        const mv = state.lastMove;
        if (!mv || mv.to !== state.floor) return null;
        const d = mv.to - mv.from;
        let kind;
        if (d < 0) kind = "ascent";
        else if (d >= GRAND_MIN && mv.direction === "center" && isGamblePoint(mv.from)) kind = "grand";
        else if (d <= 4) kind = "tiny";
        else if (d <= 9) kind = "small";
        else if (d <= 14) kind = "good";
        else kind = "great";
        const remain = turns >= 2 ? `아직 ${turns}번 남았으니 충분히 만회할 수 있어요. `
          : (turns === 1 ? "마지막 한 번 남았어요. " : "");
        const list = MOVE_CHEERS[kind];
        return list[state.cheerIndex % list.length]
          .replace("{d}", d).replace("{n}", -d).replace("{remain}", remain).replace("{dirRo}", DIR_RO[direction]);
      }

      /* ==============================================================

      const state = {

        remoteKeys: new Set(), // 서버 기록 구분값(사용자|시각) — 같은 기록을 두 번 반영하지 않도록
        remoteMaxId: 0,        // 지금까지 받은 서버 기록의 가장 큰 번호 (다음에는 이보다 새 기록만 받음)

      const el = {
