<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지옥 강하 추천기 (자동 HUD 인식형)</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #0c0e14;
      --card: #151924;
      --border: #272e40;
      --text: #f3f5fa;
      --muted: #8f9bb3;
      --accent: #4f8cff;
      --gold: #f5b942;
      --ok: #2ecc71;
      --err: #ff6b6b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .wrap {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 18px;
    }

    .status-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .status-title {
      font-size: 13px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64708a;
      display: inline-block;
    }

    .dot.live {
      background: var(--ok);
      box-shadow: 0 0 8px var(--ok);
    }

    .dot.error {
      background: var(--err);
      box-shadow: 0 0 8px var(--err);
    }

    .meta-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .floor-badge {
      background: #1b2234;
      border: 1px solid #2e3a54;
      color: var(--text);
      border-radius: 12px;
      padding: 8px 12px;
      text-align: center;
      min-width: 84px;
    }

    .floor-badge .label {
      display: block;
      font-size: 11px;
      color: var(--muted);
    }

    .floor-badge .value {
      display: block;
      font-size: 18px;
      font-weight: 800;
      color: #8ab4ff;
      margin-top: 2px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      border: 1px solid var(--border);
      background: #1d2332;
      color: var(--text);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }

    button:hover {
      border-color: var(--accent);
      background: #232b3e;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.primary:hover {
      background: #3b7af5;
    }

    button.danger {
      background: transparent;
      color: var(--muted);
      padding: 8px 12px;
      font-size: 12px;
    }

    .direction-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .dir-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 28px 12px;
      text-align: center;
      transition: 0.2s ease;
      opacity: 0.55;
    }

    .dir-card.active {
      opacity: 1;
      border-color: var(--accent);
      background: linear-gradient(180deg, rgba(79, 140, 255, 0.22), var(--card));
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
    }

    .dir-card.active.center-gamble {
      border-color: var(--gold);
      background: linear-gradient(180deg, rgba(245, 185, 66, 0.22), var(--card));
    }

    .dir-name {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .dir-tag {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .dir-card.active .dir-tag {
      color: var(--text);
      font-weight: 600;
    }

    .summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .rec-headline {
      font-size: 16px;
      font-weight: 700;
    }

    .rec-detail {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }

    .cheer-line {
      font-size: 13px;
      color: #a7c7ff;
      font-weight: 600;
      margin-top: 2px;
    }

    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      padding: 0 4px;
      gap: 8px;
    }

    .hidden-capture {
      display: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <div class="status-group">
        <div class="status-title">
          <span id="liveDot" class="dot"></span>
          <span id="statusText">화면 공유 대기 중</span>
        </div>
        <div id="stateSummary" class="meta-sub">좌측 상단 HUD 자동 인식 대기</div>
      </div>
      <div class="btn-row">
        <div class="floor-badge">
          <span class="label">현재 층수</span>
          <span id="floorDisplay" class="value">-층</span>
        </div>
        <button id="toggleShareBtn" class="primary" type="button">화면 공유 시작</button>
      </div>
    </div>

    <div class="direction-grid">
      <div id="card-left" class="dir-card">
        <div class="dir-name">왼쪽</div>
        <div id="sub-left" class="dir-tag">대기</div>
      </div>
      <div id="card-center" class="dir-card">
        <div class="dir-name">가운데</div>
        <div id="sub-center" class="dir-tag">대기</div>
      </div>
      <div id="card-right" class="dir-card">
        <div class="dir-name">오른쪽</div>
        <div id="sub-right" class="dir-tag">대기</div>
      </div>
    </div>

    <div class="summary-card">
      <div id="recHeadline" class="rec-headline">공유를 시작하면 자동으로 추천합니다</div>
      <div id="recDetail" class="rec-detail">좌측 상단 '지하 N층' 및 '강하 N회 가능' HUD를 자동으로 읽어 방향 점수를 계산합니다.</div>
      <div id="cheerText" class="cheer-line">오늘도 대박 층수 노려봅시다!</div>
    </div>

    <div class="footer-bar">
      <span id="recordCountText">내 기록: 0건 (ID: -)</span>
      <button id="resetRecordsBtn" class="danger" type="button">내 기록 초기화</button>
    </div>
  </div>

  <video id="hiddenVideo" class="hidden-capture" autoplay muted playsinline></video>
  <canvas id="hiddenCanvas" class="hidden-capture"></canvas>
  <canvas id="hudCanvas" class="hidden-capture"></canvas>

  <script>
    (function () {
      const STORAGE_KEY = "hell_descent_simple_records_v1";
      const EXTERNAL_DB_CONFIG = {
        supabaseUrl: "https://ggbsbxppkpewultsmiz.supabase.co",
        supabaseAnonKey: "sb_publishable_XGuZI--CLpwE5UliON-8Ew_Qx2GhSkM",
        supabaseTable: "hell_descent_records",
        customPostUrl: ""
      };
      const USER_ID_KEY = "hell_descent_user_id_v1";
      const CAPTURE_INTERVAL_MS = 3500;
      const MIN_SCENE_DIFF_RATIO = 0.025;

      const KEY_LABELS = {
        hell: "지옥 열쇠",
        abyss_flame: "나락의 화염 열쇠(짝수 생존)",
        abyss_frost: "나락의 서리 열쇠(홀수 생존)"
      };

      const GRADE_LABELS = {
        rare: "희귀",
        hero: "영웅",
        legend: "전설"
      };

      const CHEER_MESSAGES = {
        left: [
          "왼쪽 길 감각 좋습니다! 깊게 쭉 내려가 봅시다!",
          "차분하게 왼쪽부터 공략해 볼까요? 기운 좋습니다!",
          "왼쪽 선택 완료! 무사히 깊은 층까지 가 봅시다!"
        ],
        center: [
          "가운데 찬스 타이밍! 과감하게 승부 걸어 봅시다!",
          "가운데 기운이 왔네요! 대박 층수 한번 노려봅시다!",
          "가운데 선택! 쫄지 말고 시원하게 밀어붙여 봅시다!"
        ],
        right: [
          "오른쪽 흐름이 좋습니다! 끝까지 깊게 내려가 봅시다!",
          "오른쪽으로 쭉쭉 밀어봅시다! 좋은 결과 기대할게요!",
          "오른쪽 길 선택! 마지막까지 집중해서 가 봅시다!"
        ]
      };

      function getOrCreateUserId() {
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const customTag = (urlParams.get("u") || "").trim().replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 16);
          if (customTag) {
            localStorage.setItem(USER_ID_KEY, customTag);
            return customTag;
          }
          let existing = localStorage.getItem(USER_ID_KEY);
          if (existing) return existing;
          const randPart = (window.crypto && window.crypto.randomUUID)
            ? window.crypto.randomUUID().split("-")[0]
            : Math.random().toString(36).slice(2, 8);
          existing = `usr_${randPart}`;
          localStorage.setItem(USER_ID_KEY, existing);
          return existing;
        } catch {
          return "usr_guest";
        }
      }

      const userId = getOrCreateUserId();

      const state = {
        userId,
        stream: null,
        timerId: null,
        isBusy: false,
        ocrWorker: null,
        ocrReady: false,
        lastSamplePixels: null,
        lastFloor: null,
        lastTurn: 0,
        keyType: "hell",
        grade: "hero",
        remainingTurns: 3,
        records: loadRecords()
      };

      const el = {
        liveDot: document.getElementById("liveDot"),
        statusText: document.getElementById("statusText"),
        stateSummary: document.getElementById("stateSummary"),
        floorDisplay: document.getElementById("floorDisplay"),
        toggleShareBtn: document.getElementById("toggleShareBtn"),
        resetRecordsBtn: document.getElementById("resetRecordsBtn"),
        recordCountText: document.getElementById("recordCountText"),
        recHeadline: document.getElementById("recHeadline"),
        recDetail: document.getElementById("recDetail"),
        cheerText: document.getElementById("cheerText"),
        video: document.getElementById("hiddenVideo"),
        canvas: document.getElementById("hiddenCanvas"),
        hudCanvas: document.getElementById("hudCanvas"),
        cards: {
          left: document.getElementById("card-left"),
          center: document.getElementById("card-center"),
          right: document.getElementById("card-right")
        },
        subs: {
          left: document.getElementById("sub-left"),
          center: document.getElementById("sub-center"),
          right: document.getElementById("sub-right")
        }
      };

      async function initOcr() {
        if (state.ocrReady || !window.Tesseract) return;
        try {
          state.ocrWorker = await window.Tesseract.createWorker("kor+eng", 1, {
            logger: () => {}
          });
          await state.ocrWorker.setParameters({
            tessedit_pageseg_mode: window.Tesseract.PSM.SPARSE_TEXT
          });
          state.ocrReady = true;
        } catch (err) {
          console.warn("OCR 초기화 실패(폴백 모드 동작):", err);
          state.ocrReady = false;
        }
      }

      function loadRecords() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return [];
        }
      }

      function getMyRecords() {
        return state.records.filter(r => r.userId === state.userId);
      }

      function isSupabaseConfigured() {
        return Boolean(
          EXTERNAL_DB_CONFIG.supabaseUrl &&
          EXTERNAL_DB_CONFIG.supabaseAnonKey &&
          EXTERNAL_DB_CONFIG.supabaseTable
        );
      }

      async function pushRecordToExternalDb(record) {
        if (!isSupabaseConfigured() && !EXTERNAL_DB_CONFIG.customPostUrl) return;

        if (isSupabaseConfigured()) {
          const baseUrl = EXTERNAL_DB_CONFIG.supabaseUrl.replace(/\/+$/, "");
          const table = encodeURIComponent(EXTERNAL_DB_CONFIG.supabaseTable);
          const endpoint = `${baseUrl}/rest/v1/${table}`;
          try {
            const res = await fetch(endpoint, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "apikey": EXTERNAL_DB_CONFIG.supabaseAnonKey,
                "Authorization": `Bearer ${EXTERNAL_DB_CONFIG.supabaseAnonKey}`,
                "Prefer": "return=minimal"
              },
              body: JSON.stringify({
                user_id: record.userId,
                recorded_at: new Date(record.ts).toISOString(),
                floor: record.floor,
                delta: record.delta,
                direction: record.direction,
                key_type: record.keyType,
                grade: record.grade,
                remaining_turns: record.remainingTurns,
                gamble: record.gamble
              })
            });
            if (!res.ok) {
              console.warn("Supabase 저장 응답 오류:", res.status);
            }
          } catch (err) {
            console.warn("Supabase 네트워크 전송 실패:", err);
          }
        }

        if (EXTERNAL_DB_CONFIG.customPostUrl) {
          try {
            await fetch(EXTERNAL_DB_CONFIG.customPostUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(record)
            });
          } catch (err) {
            console.warn("외부 엔드포인트 전송 실패:", err);
          }
        }
      }

      function saveRecords() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.records));
        } catch (e) {
          console.warn("localStorage 저장 실패:", e);
        }
        updateRecordCounter();
      }

      function updateRecordCounter() {
        if (el.recordCountText) {
          const myCount = getMyRecords().length;
          el.recordCountText.textContent = `내 기록: ${myCount}건 (ID: ${state.userId})`;
        }
      }

      function setErrorState(title, detail) {
        if (el.liveDot) {
          el.liveDot.classList.remove("live");
          el.liveDot.classList.add("error");
        }
        if (el.statusText) el.statusText.textContent = "공유 오류/제한됨";
        if (el.recHeadline) el.recHeadline.textContent = title;
        if (el.recDetail) el.recDetail.textContent = detail;
      }

      function hasMeaningfulSceneChange(ctx, w, h) {
        const img = ctx.getImageData(0, 0, w, h).data;
        const sampled = [];
        for (let i = 0; i < img.length; i += 32) {
          sampled.push(img[i], img[i + 1], img[i + 2]);
        }

        if (!state.lastSamplePixels || state.lastSamplePixels.length !== sampled.length) {
          state.lastSamplePixels = sampled;
          return true;
        }

        let changedChannels = 0;
        for (let i = 0; i < sampled.length; i += 3) {
          const dr = Math.abs(sampled[i] - state.lastSamplePixels[i]);
          const dg = Math.abs(sampled[i + 1] - state.lastSamplePixels[i + 1]);
          const db = Math.abs(sampled[i + 2] - state.lastSamplePixels[i + 2]);
          if (dr + dg + db > 40) {
            changedChannels++;
          }
        }

        const totalPixels = sampled.length / 3;
        const diffRatio = changedChannels / totalPixels;
        if (diffRatio < MIN_SCENE_DIFF_RATIO) {
          return false;
        }

        state.lastSamplePixels = sampled;
        return true;
      }

      function prepareHighContrastHudCrop(videoEl, hudCanvasEl) {
        const vw = videoEl.videoWidth || 1280;
        const vh = videoEl.videoHeight || 720;
        // 좌측 상단 HUD ('지하 15층', '강하 3회 가능') 영역 크롭 및 확대
        const sx = Math.floor(vw * 0.005);
        const sy = Math.floor(vh * 0.02);
        const sw = Math.floor(vw * 0.16);
        const sh = Math.floor(vh * 0.27);

        const targetW = 480;
        const targetH = 320;
        hudCanvasEl.width = targetW;
        hudCanvasEl.height = targetH;

        const hctx = hudCanvasEl.getContext("2d");
        hctx.drawImage(videoEl, sx, sy, sw, sh, 0, 0, targetW, targetH);

        const imgData = hctx.getImageData(0, 0, targetW, targetH);
        const d = imgData.data;
        // 밝은 글씨(층수/횟수) 대비를 높여 OCR 인식률 향상
        for (let i = 0; i < d.length; i += 4) {
          const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
          const boosted = lum > 135 ? 255 : (lum < 65 ? 0 : Math.min(255, Math.max(0, (lum - 65) * 3.6)));
          d[i] = boosted;
          d[i + 1] = boosted;
          d[i + 2] = boosted;
        }
        hctx.putImageData(imgData, 0, 0);
        return hudCanvasEl;
      }

      function parseFloorFromOcrText(rawText) {
        if (!rawText) return null;
        const normalized = rawText.replace(/\s+/g, " ");
        // '지하 15층', '15층', '15 층' 패턴 우선 추출
        const floorMatch = normalized.match(/(?:지하\s*)?(\d{1,3})\s*층/);
        if (floorMatch) {
          const n = parseInt(floorMatch[1], 10);
          if (n >= 1 && n <= 100) return n;
        }
        return null;
      }

      function parseTurnsFromOcrText(rawText) {
        if (!rawText) return null;
        const normalized = rawText.replace(/\s+/g, " ");
        const turnMatch = normalized.match(/강하\s*(\d)\s*회/);
        if (turnMatch) {
          const t = parseInt(turnMatch[1], 10);
          if (t >= 0 && t <= 6) return t;
        }
        return null;
      }

      async function detectGameContext(ctx, w, h, videoEl) {
        const keyBadgeArea = ctx.getImageData(
          Math.floor(w * 0.01),
          Math.floor(h * 0.04),
          Math.floor(w * 0.15),
          Math.floor(h * 0.20)
        ).data;
        const centerMsg = ctx.getImageData(
          Math.floor(w * 0.32),
          Math.floor(h * 0.62),
          Math.floor(w * 0.36),
          Math.floor(h * 0.16)
        ).data;

        let crimsonCount = 0;
        let frostBlueCount = 0;
        let legendGoldCount = 0;
        let rareBlueCount = 0;

        for (let i = 0; i < keyBadgeArea.length; i += 12) {
          const r = keyBadgeArea[i];
          const g = keyBadgeArea[i + 1];
          const b = keyBadgeArea[i + 2];
          if (r > 195 && g < 95 && b < 95) crimsonCount++;
          if (b > 195 && r < 120 && g > 130) frostBlueCount++;
          if (r > 205 && g > 155 && b < 70) legendGoldCount++;
          if (b > 185 && r < 100 && g < 160) rareBlueCount++;
        }

        let detectedKeyType = state.keyType;
        if (crimsonCount > frostBlueCount && crimsonCount > 18) {
          detectedKeyType = "abyss_flame";
        } else if (frostBlueCount > crimsonCount && frostBlueCount > 18) {
          detectedKeyType = "abyss_frost";
        } else if (crimsonCount <= 12 && frostBlueCount <= 12 && state.lastTurn === 0) {
          detectedKeyType = "hell";
        }

        let detectedGrade = state.grade;
        if (legendGoldCount > 35) {
          detectedGrade = "legend";
        } else if (rareBlueCount > 35) {
          detectedGrade = "rare";
        } else if (state.lastTurn === 0) {
          detectedGrade = "hero";
        }

        let centerGold = 0;
        for (let i = 0; i < centerMsg.length; i += 16) {
          if (centerMsg[i] > 190 && centerMsg[i + 1] > 150 && centerMsg[i + 2] < 110) centerGold++;
        }
        const hasGambleAlert = centerGold > 25;

        let ocrFloor = null;
        let ocrTurns = null;
        let ocrTextSnippet = "";

        if (state.ocrReady && state.ocrWorker && videoEl) {
          try {
            const processedHud = prepareHighContrastHudCrop(videoEl, el.hudCanvas);
            const { data } = await state.ocrWorker.recognize(processedHud);
            ocrTextSnippet = (data && data.text ? data.text : "").replace(/\s+/g, " ").trim().slice(0, 30);
            ocrFloor = parseFloorFromOcrText(data && data.text ? data.text : "");
            ocrTurns = parseTurnsFromOcrText(data && data.text ? data.text : "");
          } catch (err) {
            console.warn("OCR 인식 중 오류:", err);
          }
        }

        let resolvedFloor;
        let floorSource = "추정";
        if (ocrFloor !== null) {
          resolvedFloor = ocrFloor;
          floorSource = "HUD 인식";
        } else if (state.lastFloor !== null) {
          // OCR이 잠깐 못 읽었을 때는 이전 층수에서 과도하게 튀지 않게 완만히 유지/진행
          resolvedFloor = Math.min(100, Math.max(1, state.lastFloor + 5));
          floorSource = "연속 보간";
        } else {
          resolvedFloor = 15;
          floorSource = "초기값";
        }

        let activeRemaining;
        if (ocrTurns !== null) {
          activeRemaining = ocrTurns;
        } else if (state.lastTurn === 0) {
          activeRemaining = detectedGrade === "legend" ? 4 : 3;
        } else {
          activeRemaining = state.remainingTurns;
        }

        state.keyType = detectedKeyType;
        state.grade = detectedGrade;
        state.remainingTurns = activeRemaining;

        return {
          floor: resolvedFloor,
          floorSource,
          ocrTextSnippet,
          hasGambleAlert,
          remainingAtTurn: activeRemaining
        };
      }

      function scoreDirection(direction, ctxInfo) {
        let score = 50;
        const myRecs = getMyRecords();
        const exactMatching = myRecs.filter(
          r => r.direction === direction && r.keyType === state.keyType && r.grade === state.grade
        );
        const keyMatching = myRecs.filter(
          r => r.direction === direction && r.keyType === state.keyType
        );
        const fallbackMatching = exactMatching.length > 0
          ? exactMatching
          : (keyMatching.length > 0
            ? keyMatching
            : myRecs.filter(r => r.direction === direction));

        if (fallbackMatching.length > 0) {
          const avgDelta = fallbackMatching.reduce((acc, item) => acc + (item.delta || 10), 0) / fallbackMatching.length;
          score += (avgDelta - 10) * 1.5;
        }

        const recentSameDir = myRecs.slice(-3).filter(r => r.direction === direction).length;
        score -= recentSameDir * 4;

        if (direction === "center") {
          if (ctxInfo.hasGambleAlert || ctxInfo.floor % 20 === 0 || state.lastTurn % 4 === 2) {
            score += 14;
          } else {
            score -= 10;
          }
        } else if (direction === "left") {
          const leftTargetFloor = ctxInfo.floor + 10;
          if (state.keyType === "abyss_flame") {
            score += leftTargetFloor % 2 === 0 ? 7 : -5;
          } else if (state.keyType === "abyss_frost") {
            score += leftTargetFloor % 2 === 1 ? 7 : -5;
          } else {
            score += ctxInfo.floor < 45 ? 5 : 1;
          }
        } else if (direction === "right") {
          const rightTargetFloor = ctxInfo.floor + 13;
          if (state.keyType === "abyss_flame") {
            score += rightTargetFloor % 2 === 0 ? 8 : -5;
          } else if (state.keyType === "abyss_frost") {
            score += rightTargetFloor % 2 === 1 ? 8 : -5;
          } else {
            score += ctxInfo.floor >= 45 ? 6 : 2;
          }
          if (state.grade === "legend" && ctxInfo.remainingAtTurn <= 2) {
            score += 4;
          }
        }

        return Math.round(score);
      }

      function buildReasonText(bestDir, ctxInfo) {
        const keyName = KEY_LABELS[state.keyType] || "지옥 열쇠";
        const gradeName = GRADE_LABELS[state.grade] || "영웅";
        const sameComboCount = getMyRecords().filter(
          r => r.keyType === state.keyType && r.grade === state.grade
        ).length;

        if (bestDir === "center") {
          return `[${state.userId}] ${keyName} · ${gradeName} · 현재 ${ctxInfo.floor}층(${ctxInfo.floorSource}) 변수 타이밍이라 '가운데'를 골랐어요 (내 기록 ${sameComboCount}건 반영).`;
        }
        if (bestDir === "right") {
          return `[${state.userId}] ${keyName} · ${gradeName} · 현재 ${ctxInfo.floor}층(${ctxInfo.floorSource}) 기준 더 깊은 층수와 생존 조건을 고려해 '오른쪽'을 골랐어요 (내 기록 ${sameComboCount}건 반영).`;
        }
        return `[${state.userId}] ${keyName} · ${gradeName} · 현재 ${ctxInfo.floor}층(${ctxInfo.floorSource}) 흐름과 열쇠 조건을 따져 안정적인 '왼쪽'을 골랐어요 (내 기록 ${sameComboCount}건 반영).`;
      }

      function pickCheerText(bestDir) {
        const list = CHEER_MESSAGES[bestDir] || CHEER_MESSAGES.left;
        return list[state.lastTurn % list.length];
      }

      function appendAutoRecord(direction, ctxInfo) {
        const prevFloor = state.lastFloor ?? ctxInfo.floor;
        const delta = Math.max(1, Math.abs(ctxInfo.floor - prevFloor) || 1);

        const newRecord = {
          userId: state.userId,
          ts: Date.now(),
          floor: ctxInfo.floor,
          delta,
          direction,
          keyType: state.keyType,
          grade: state.grade,
          remainingTurns: ctxInfo.remainingAtTurn,
          gamble: ctxInfo.hasGambleAlert
        };
        state.records.push(newRecord);
        pushRecordToExternalDb(newRecord);

        if (state.records.length > 600) {
          state.records.shift();
        }

        state.lastFloor = ctxInfo.floor;
        state.lastTurn += 1;
        state.remainingTurns = Math.max(0, ctxInfo.remainingAtTurn - 1);
        saveRecords();
      }

      function renderRecommendation(ctxInfo, scores, bestDir) {
        ["left", "center", "right"].forEach(dir => {
          const card = el.cards[dir];
          if (!card) return;
          card.classList.remove("active", "center-gamble");
          el.subs[dir].textContent = `점수 ${scores[dir]}`;

          if (dir === bestDir) {
            card.classList.add("active");
            if (dir === "center" && ctxInfo.hasGambleAlert) {
              card.classList.add("center-gamble");
            }
            el.subs[dir].textContent = "추천 선택";
          }
        });

        const labelMap = { left: "왼쪽", center: "가운데", right: "오른쪽" };
        const keyName = KEY_LABELS[state.keyType] || "지옥 열쇠";
        const gradeName = GRADE_LABELS[state.grade] || "영웅";

        if (el.floorDisplay) {
          el.floorDisplay.textContent = `${ctxInfo.floor}층`;
        }
        el.recHeadline.textContent = `지금은 '${labelMap[bestDir]}' 추천`;
        el.recDetail.textContent = buildReasonText(bestDir, ctxInfo);
        if (el.cheerText) {
          el.cheerText.textContent = pickCheerText(bestDir);
        }
        el.stateSummary.textContent = `${keyName} · ${gradeName} · 남은 ${ctxInfo.remainingAtTurn}회 · ${ctxInfo.floorSource}`;
      }

      async function captureTick() {
        if (state.isBusy || !state.stream || !el.video || el.video.readyState < 2) return;
        state.isBusy = true;

        try {
          const w = 640;
          const h = 360;
          el.canvas.width = w;
          el.canvas.height = h;
          const ctx = el.canvas.getContext("2d");
          ctx.drawImage(el.video, 0, 0, w, h);

          if (!hasMeaningfulSceneChange(ctx, w, h)) return;

          const ctxInfo = await detectGameContext(ctx, w, h, el.video);
          const scores = {
            left: scoreDirection("left", ctxInfo),
            center: scoreDirection("center", ctxInfo),
            right: scoreDirection("right", ctxInfo)
          };
          const bestDir = Object.entries(scores).sort((a, b) => b[1] - a[1])[0][0];

          appendAutoRecord(bestDir, ctxInfo);
          renderRecommendation(ctxInfo, scores, bestDir);
        } finally {
          state.isBusy = false;
        }
      }

      async function startShare() {
        if (!window.isSecureContext) {
          setErrorState(
            "보안(HTTPS) 환경이 아닙니다",
            "HTTPS로 서비스되는 독립 페이지에서 열어주세요."
          );
          return;
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
          setErrorState(
            "이 브라우저/프레임에서는 화면 공유가 차단되어 있습니다",
            "독립 HTTPS 주소로 직접 열어주세요."
          );
          return;
        }

        try {
          const stream = await navigator.mediaDevices.getDisplayMedia({
            video: { frameRate: { ideal: 15, max: 30 } },
            audio: false
          });

          state.stream = stream;
          el.video.srcObject = stream;
          if (el.video.play) {
            el.video.play().catch(() => {});
          }

          if (el.liveDot) {
            el.liveDot.classList.remove("error");
            el.liveDot.classList.add("live");
          }
          if (el.statusText) el.statusText.textContent = "자동 HUD 인식 중";
          if (el.toggleShareBtn) el.toggleShareBtn.textContent = "공유 중지";

          initOcr();

          const track = stream.getVideoTracks()[0];
          if (track) {
            track.addEventListener("ended", () => stopShare(false));
          }

          clearInterval(state.timerId);
          state.timerId = setInterval(captureTick, CAPTURE_INTERVAL_MS);
          setTimeout(captureTick, 900);
        } catch (err) {
          const errName = err && err.name ? err.name : "Error";
          const errMsg = err && err.message ? err.message : "권한이 거부되었거나 차단되었습니다.";
          stopShare(true);
          setErrorState(`화면 공유 시작 실패 (${errName})`, errMsg);
        }
      }

      function stopShare(keepErrorDot = false) {
        clearInterval(state.timerId);
        state.timerId = null;

        if (state.stream) {
          state.stream.getTracks().forEach(t => {
            try { t.stop(); } catch {}
          });
          state.stream = null;
        }

        if (el.video) {
          el.video.srcObject = null;
        }
        if (el.liveDot) {
          el.liveDot.classList.remove("live");
          if (!keepErrorDot) {
            el.liveDot.classList.remove("error");
          }
        }
        if (!keepErrorDot && el.statusText) {
          el.statusText.textContent = "화면 공유 대기 중";
        }
        if (el.toggleShareBtn) {
          el.toggleShareBtn.textContent = "화면 공유 시작";
        }
      }

      if (el.toggleShareBtn) {
        el.toggleShareBtn.addEventListener("click", () => {
          if (state.stream) {
            stopShare(false);
          } else {
            startShare();
          }
        });
      }

      if (el.resetRecordsBtn) {
        el.resetRecordsBtn.addEventListener("click", () => {
          state.records = state.records.filter(r => r.userId !== state.userId);
          state.lastFloor = null;
          state.lastTurn = 0;
          state.lastSamplePixels = null;
          state.remainingTurns = 3;
          saveRecords();
          if (el.floorDisplay) el.floorDisplay.textContent = "-층";
          if (el.recHeadline) el.recHeadline.textContent = "내 기록이 초기화되었습니다";
          if (el.recDetail) el.recDetail.textContent = "다시 공유를 시작하면 내 ID로 새 기록이 쌓입니다.";
          if (el.cheerText) el.cheerText.textContent = "새 기록으로 다시 대박 층수 도전해 봅시다!";
        });
      }

      updateRecordCounter();
    })();
  </script>
